# Pass 3f (D27): the numbers the bid set's checks use. The fields a window quote needs (Jon,
# 2026-11-19) are names, not numbers, and live in src/brownfield/bidset.py's IDS table.
#
# IBC 2018 is the edition Pennsylvania's UCC adopted. Chapter 24 was read on UpCodes'
# "Pennsylvania Building Code 2018 (adopts with amendments)"
# (https://up.codes/viewer/pennsylvania/ibc-2018/chapter/24/glass-and-glazing, 2026-11-19).
# Sections 1006.3.3, Table 1006.3.3(1) and 1030 were read by Jon in an online IBC 2018 viewer
# and shared as screenshots (2026-11-19); the fetch tools couldn't reach them. Pennsylvania's
# amendments were not checked.

code:
  fenestration_u_max:
    value: 0.30
    unit: Btu/h ft2 F, the highest U-factor a window or glazed door may have (climate zone 5)
    conf: medium
    source: "2018 IECC climate zone 5: fenestration U-0.30, the source of pass3.envelope.window_u (2018 IECC zone 5 and the Lebanon County residential energy worksheet)"
  safety_glazing:
    door_arc_in:
      value: 24
      unit: in, glazing whose nearest vertical edge is within this arc of either vertical edge of a closed door is a hazardous location (with the bottom-edge test below)
      conf: high
      source: "IBC 2018 2406.4.2 Glazing adjacent to doors, on UpCodes (Pennsylvania Building Code 2018): 'within a 24-inch (610 mm) arc of either vertical edge of the door in a closed position'"
    door_bottom_in:
      value: 60
      unit: in above the walking surface, the bottom exposed edge below which glazing next to a door is a hazardous location
      conf: high
      source: "IBC 2018 2406.4.2, same page: 'less than 60 inches (1524 mm) above the walking surface'"
    window_area_ft2:
      value: 9
      unit: ft2, an individual pane larger than this is one of 2406.4.3's four conditions for a window
      conf: high
      source: "IBC 2018 2406.4.3 Glazing in windows, same page: exposed area of an individual pane greater than 9 square feet (0.84 m2)"
    window_bottom_in:
      value: 18
      unit: in above the floor, a bottom edge below this is one of 2406.4.3's conditions
      conf: high
      source: "IBC 2018 2406.4.3, same page: bottom edge less than 18 inches (457 mm) above the floor"
    window_top_in:
      value: 36
      unit: in above the floor, a top edge above this is one of 2406.4.3's conditions
      conf: high
      source: "IBC 2018 2406.4.3, same page: top edge greater than 36 inches (914 mm) above the floor"
    window_walk_in:
      value: 36
      unit: in, horizontally from the plane of the glazing, a walking surface within this is one of 2406.4.3's conditions
      conf: high
      source: "IBC 2018 2406.4.3, same page: one or more walking surfaces within 36 inches (914 mm), measured horizontally in a straight line, of the plane of the glazing"
  escape:
    min_area_ft2:
      value: 5.7
      unit: ft2, the least net clear opening of an emergency escape and rescue opening (an escape window)
      conf: high
      source: "IBC 2018 1030.2 Minimum size: 'a minimum net clear opening of 5.7 square feet (0.53 m2)'. Its exception, 5 ft2 for grade-floor openings, isn't used: 5.7 everywhere is the safe side"
    min_height_in:
      value: 24
      unit: in, the least net clear opening height of an escape window
      conf: high
      source: "IBC 2018 1030.2.1 Minimum dimensions: 'The minimum net clear opening height dimension shall be 24 inches (610 mm)'; the dimensions 'shall be the result of normal operation of the opening'"
    min_width_in:
      value: 20
      unit: in, the least net clear opening width of an escape window
      conf: high
      source: "IBC 2018 1030.2.1: 'The minimum net clear opening width dimension shall be 20 inches (508 mm)'"
    max_sill_in:
      value: 44
      unit: in above the floor, the highest the bottom of an escape window's clear opening may be
      conf: high
      source: "IBC 2018 1030.3 Maximum height from floor: the bottom of the clear opening 'not greater than 44 inches (1118 mm) measured from the floor'"
  single_exit:
    r2_max_storey:
      value: 3
      unit: storeys above grade plane, the highest storey of an R-2 building (dwelling units) that may have a single exit
      conf: high
      source: "IBC 2018 Table 1006.3.3(1) Stories with one exit or access to one exit for R-2 occupancies: 'Basement, first, second or third story above grade plane' R-2 (footnotes a, b); 'Fourth story above grade plane and higher' NP. Footnote a: R-2 buildings 'equipped throughout with an automatic sprinkler system in accordance with Section 903.3.1.1 or 903.3.1.2 and provided with emergency escape and rescue openings in accordance with Section 1030'"
    r2_max_units:
      value: 4
      unit: dwelling units, the most on a storey with a single exit
      conf: high
      source: "IBC 2018 Table 1006.3.3(1): maximum number of dwelling units '4 dwelling units'"
    r2_max_common_path_ft:
      value: 125
      unit: ft, the longest common path of egress travel on a storey with a single exit
      conf: high
      source: "IBC 2018 Table 1006.3.3(1): maximum common path of egress travel distance '125 feet'"

flat_bedrooms:
  value: 2
  low: 1
  high: 3
  unit: bedrooms (sleeping rooms) in each of the walk-up's flats, each needing an escape window where 1030.1 applies
  conf: medium
  source: "pass 4 prices each walk-up flat as a 2-bedroom (pass4 flat TDC: HUD 2024 Unit Total Development Cost limits, walk-up 2 bedrooms); forge's flats are 45 x 20 ft, ~900 ft2. low and high: the village's mix runs from studios to 3 bedrooms (params/village.yaml flat_mix). The model has no rooms"

addendum_1:
  patio_door_width_in:
    value: 60
    unit: in, the patio doors' width after pass 3f's made-up Addendum 1 (forge `apartment-json addendum-1 60`)
    conf: placeholder
    source: "made up for pass 3f step 5, to run a change through the bid set: a stock 5'-0\" patio door width, narrower than the model's 6'-0\" so the windows beside it clear IBC 2018 2406.4.2's arc"
