# --- Research inputs (2026-11-16; 'not opened' marks a search-summary figure) ---

# Neighbourhood at the campus edge. Research inputs (agents, 2026-11-16).

housing_cost:
  cost_per_ft2_nahb:
    value: 162
    low: 149
    high: 193
    unit: $/ft2 of finished floor area, construction cost only (no lot, overhead, marketing, commission or profit), typical new single-family home, 2024 dollars (low = without the site-work line; high = Middle Atlantic spec median 2025, which includes builder margin)
    conf: medium
    source: "NAHB, Eric Lynch, 'Cost of Constructing a Home-2024', 2025-01-20 (https://nahb.org/-/media/AB4EFC742624475A97A0A62189986FF8.ashx), Table 1: 'Average Finished Area: 2,647'; 'B. Total Construction Cost $428,215' (64.4% of the $665,298 sales price); 'I. Site Work (sum of A to E) $32,719'. 428,215 / 2,647 = 161.8; (428,215 - 32,719) / 2,647 = 149.4 (my arithmetic). Caveat in the report: 'usable responses were received from 41 builders' and 'not designed to capture representative characteristics of the average home'. High: Siniavskaia, NAHB Eye on Housing 2026-09-14, from Census SOC (https://eyeonhousing.org/2026/09/custom-home-premium-highest-since-2011/): 'The Middle Atlantic, the next most expensive spec home market, registered square foot prices of $193'"
  contract_price_per_ft2_census:
    value: 171
    low: 152
    high: 193
    unit: $/ft2 floor area, median price excluding the improved lot, new single-family DETACHED homes started in 2025 (value = custom, contractor-built; low = spec national; high = spec Middle Atlantic). Includes builder margin
    conf: high
    source: "Siniavskaia, NAHB Eye on Housing, 2026-09-14, from Census Survey of Construction (https://eyeonhousing.org/2026/09/custom-home-premium-highest-since-2011/): 'For custom single-family detached (SFD) homes started in 2025, the median price climbed to $171 per square foot'; 'For spec starts, after excluding improved lot values, the median was $152 per square foot'. 2024 values $166 custom, $153 spec (https://eyeonhousing.org/2025/10/square-foot-prices-moderate-in-2024/)"
  cost_per_ft2_icc_bvd_r3:
    value: 170.80
    low: 170.80
    high: 182.23
    unit: $/ft2 gross area, ICC Building Valuation Data Aug 2025, Group R-3 one- and two-family dwellings (townhouses under the IRC are R-3), national average, construction type VB (value, low) to VA (high)
    conf: medium
    source: "ICC, 'Building Valuation Data - AUGUST 2025', copy hosted by City of Kirkland WA (https://www.kirklandwa.gov/files/sharedassets/public/v/2/development-services/pdfs/building-pdfs/icc-august-2025.pdf): row 'R-3 Residential, one- and two-family' VA 182.23, VB 170.80; 'The average costs include foundation work, structural and nonstructural building components, electrical, plumbing, mechanical and interior finish material'; 'This data table is not intended to be used as an estimating guide'"
  garage_cost_per_ft2:
    value: 69.64
    low: 49
    high: 90
    unit: $/ft2 gross area of a private garage, 2025 dollars, national (value = ICC BVD Group U, type VB; low/high = consumer cost guides)
    conf: low
    source: "ICC Building Valuation Data Aug 2025 (above): 'U Utility, miscellaneous' VA 72.88, VB 69.64; footnote 'a. Private Garages use Utility, miscellaneous'; 'b. For shell only buildings deduct 20 percent' (69.64 x 0.8 = 55.71, my arithmetic). Low: Dreamlands Design, July 2025, about $49/ft2 for a two-car garage (search summary, not opened). High: The Pricer, Jan 2026, $90/ft2 (search summary, not opened; its own table does not reconcile). HomeAdvisor detached garage $19,200-$33,600 (search summary, not opened; page returned 403). No RSMeans figure found (paywalled)"
  garage_to_house_cost_ratio:
    value: 0.41
    low: 0.40
    high: 0.41
    unit: ratio of garage $/ft2 to dwelling $/ft2 (ICC BVD U / R-3, type VB value and high, VA low)
    conf: medium
    source: "ICC BVD Aug 2025 (above): 69.64 / 170.80 = 0.408 (VB); 72.88 / 182.23 = 0.400 (VA) (my arithmetic)"
  floor_u_over_garage:
    value: 0.033
    low: 0.028
    high: 0.047
    unit: Btu/h-ft2-F, maximum assembly U-factor of a floor over unconditioned space (an unheated garage), IECC 2021 Table R402.1.2, Climate Zone 5 (low = CZ 7-8 limit, high = CZ 4 limit). 0.033 Btu/h-ft2-F = 0.187 W/m2-K (my arithmetic)
    conf: high
    source: "Insulation Institute, 'Pennsylvania Uniform Construction Code: Summary of key residential energy code requirements' N109, Dec 2025 (https://insulationinstitute.org/wp-content/uploads/2025/12/N109-PA-Energy-Code-1225.pdf): 'The 2021 IECC with Pennsylvania specific amendments went into effect on January 1, 2026'; Floors CZ 4 'R-19 / U-0.047', CZ 5 'R-30 / U-0.033'. Same 0.033 in the base 2021 IECC Table R402.1.2 as reproduced in NAHB '2021 IECC Suggested Amendments', 2021-06-18 (https://www.nahb.org/-/media/NAHB/advocacy/docs/top-priorities/codes/code-adoption/nahb-suggested-amendments-2021-iecc.pdf), and Utah Clean Energy table 'Floor U-Factor 0.047 0.033 0.033' for CZ 3, 5, 6 (search summary, not opened). ICC's own code site returned 403"
  floor_r_over_garage:
    value: 30
    low: 19
    high: 38
    unit: h-ft2-F/Btu, minimum floor insulation R-value, IECC 2021 Table R402.1.3, CZ 5 (low = footnote g alternative 'fill the framing cavity' minimum; high = CZ 7-8). R-30 = 5.28 m2-K/W (my arithmetic)
    conf: high
    source: "Insulation Institute N109 (above): CZ 5 Floors 'R-30 / U-0.033'. PA amendments to the 2021 IECC (Ross Township PA copy, https://www.ross.pa.us/DocumentCenter/View/2245/2021-IECC-PA-Amendments), Table R402.1.3 footnote g: 'Alternatively, insulation sufficient to fill the framing cavity providing not less than an R-value of R-19.' CZ 7-8 floor 38 from the NAHB reproduction of Table R402.1.3 (above)"
  median_new_sf_floor_area:
    value: 2142
    low: 2090
    high: 2459
    unit: ft2, median floor area of new single-family houses completed in 2025 (detached and attached together; low = West median, high = Northeast median)
    conf: high
    source: "Census, 'Highlights of 2025 Characteristics of New Housing' (https://www.census.gov/construction/chars/highlights.html): 'The median size of a completed single-family home was 2,142 square feet'; 'The median size of a new single-family home sold in 2025 was 2,194 square feet'. Regional medians from Census table squarefeet_cust.xls sheet SFTotalMedAvgSqFt, 2025 row: Northeast 2,459, Midwest 1,969, South 2,162, West 2,090; US average 2,378 (https://www.census.gov/construction/chars/xls/squarefeet_cust.xls, downloaded and read)"
  townhouse_floor_area:
    value: 1615
    low: 1412
    high: 2142
    unit: ft2, average floor area of an existing single-family attached home (US housing stock 2020; low = heated area only; high = median of all new single-family homes 2025, an upper bound)
    conf: low
    source: "EIA, RECS 2020, Table HC10.1 'Total square footage of U.S. homes, 2020' (https://www.eia.gov/consumption/residential/data/2020/hc/xls/HC%2010.1.xlsx, downloaded and read): 'Single-family attached' 7.45 million units, 12.03 billion ft2 total, 10.52 billion ft2 heated; 12.03e9 / 7.45e6 = 1,615 and 10.52e9 / 7.45e6 = 1,412 (my arithmetic). Detached for comparison 2,264 total, 2,003 heated (my arithmetic). This is the whole stock, not new construction; no Census figure for new townhouses found"
  share_new_sf_two_car_garage:
    value: 0.64
    low: 0.55
    high: 0.72
    unit: fraction of new single-family houses completed in 2025 with a 2-car garage (low = Northeast; high = built for sale, US)
    conf: high
    source: "Census table parking_cust.xls (https://www.census.gov/construction/chars/xls/parking_cust.xls, downloaded and read), sheet SFTotalParking, 2025: US 64% 2-car, 15% 3+ car, 10% 1-car, 9% none; Northeast 55% 2-car; sheet SFForSaleParking, US 72% 2-car"
  townhouse_share_sf_starts:
    value: 0.173
    low: 0.173
    high: 0.19
    unit: fraction of US single-family starts that are townhouses, 2024 (value = four-quarter moving average; high = Q4 2024 alone)
    conf: high
    source: "Dietz, NAHB Eye on Housing, 2025-02-21, from Census data (https://eyeonhousing.org/2025/02/townhouse-construction-expanded-in-2024/): '174,000 homes, which is 10% higher than the prior four-quarter period'; 'Townhouses made up 19% of single-family housing starts for the fourth quarter of the year, a data series high'; one-year moving average 17.3%"
  construction_share:
    value: 0.644
    low: 0.60
    high: 0.70
    unit: share of a new home's sale price that is construction (the rest land, financing, overhead, sales, profit)
    conf: low
    source: "NAHB, Cost of Constructing a Home 2024: construction 64.4% of the average sales price (as recalled; to confirm against the survey)"

acoustics:
  ibc_stc_min:
    value: 50
    low: 45
    high: 50
    unit: STC, minimum airborne rating of walls and floors between dwelling units, IBC 2021 s.1206.2 (value = lab, ASTM E90; low = NNIC if field tested, ASTM E336). Applies to IBC buildings (R-2 etc.), not to IRC townhouses
    conf: high
    source: "IBC 2021 as adopted without amendment by Colorado DFPC, on UpCodes (https://up.codes/viewer/colorado/ibc-2021/chapter/12/interior-environment): 1206.2 'shall have a sound transmission class of not less than 50 where tested in accordance with ASTM E90'; alternatively 'a Normalized Noise Isolation Class (NNIC) rating of not less than 45 if field tested'"
  ibc_iic_min:
    value: 50
    low: 45
    high: 50
    unit: IIC, minimum impact rating of floor/ceiling assemblies between dwelling units, IBC 2021 s.1206.3 (low = NISR field, ASTM E1007). Only for stacked units; side-by-side townhouses have no shared floor
    conf: high
    source: "Same UpCodes IBC 2021 page: 1206.3 'shall have an impact insulation class rating of not less than 50 where tested in accordance with ASTM E492'; alternatively NISR 'not less than 45 if field tested'"
  irc_appendix_ak_stc:
    value: 45
    low: 45
    high: 45
    unit: STC, IRC Appendix AK minimum between dwelling units (townhouses, duplexes); appendix applies only where the jurisdiction adopts it
    conf: medium
    source: "Thorburn, 'Acoustical Considerations for Mixed-Use Wood-Frame Buildings', WoodWorks WW-WSP-02, June 2014 (https://www.woodworks.org/wp-content/uploads/Acoustics_Solutions_Paper.pdf): 'The International Residential Code (IRC) requires a minimum design separation of STC 45 for townhouses.' AWC FAQ 2024-01-18 (https://awc.org/faq/do-u-s-model-building-codes-contain-provisions-placing-minimum-sound-transmission-performance-requirements-for-exterior-walls/): 'The sections of the IBC and IRC that deal with sound transmission are IBC Section 1206 and IRC Appendix AK.' Appendix AK text itself not opened; whether PA's UCC adopts it not checked"
  stc_single_stud:
    value: 36
    low: 32
    high: 39
    unit: STC, single row 2x4 wood studs, one layer 5/8 in Type X gypsum each side, batt in cavity, 1 h fire (low = same with no insulation; high = lab test W2069, 1/2 in Type X with batt)
    conf: high
    source: "Owens Corning Canada, 'Wall & Floor Assembly Guide: Insulation for Sound & Fire Rated Assemblies', 2024 (https://dcpd6wotaa0mb.cloudfront.net/mdms/dms/Residential%20Insulation/300746/300746B-QZ-Wall-Floor-Assembly-Guide-EN.pdf), reproducing National Building Code of Canada wall types: 'NBC-W1a ... 36' (SLWS147, 5/8 in Type X each side, batt, 1 h); 'NBC-W1d ... 32' (no insulation); 'W2069 (16\" o.c.) 39'. NRC CBD-239 (below): common single-stud partition 'has an STC rating of about 33'"
  stc_single_stud_resilient:
    value: 45
    low: 40
    high: 50
    unit: STC, single row 2x4 wood studs with resilient channels one side, one layer 5/8 in Type X each side, batt (low = no insulation; high = NRC lab test, studs 24 in o.c.)
    conf: high
    source: "Owens Corning guide (above), 'Single Layer Wood Stud Wall with Resilient Channels': 'NBC-W3a (16\" o.c.) 45'; 'NRC-TL-93-098 (24\") 50'; no insulation 'NRC-TL-93-122 (16\") 40'"
  stc_double_stud_1layer:
    value: 57
    low: 54
    high: 60
    unit: STC, double row of 2x4 wood studs on separate plates 1 in (25 mm) apart, one layer 5/8 in Type X each side, batts in both rows, 1 h fire (low = batt in one row only; high = lab test W02985, studs 24 in o.c.)
    conf: high
    source: "Owens Corning guide (above), 'Single Layer Double Wood Stud Wall': 'NBC-W13a (16\" o.c.) 57' and 'NRC-TL-93-266 (16\" o.c.) 56', 'W02985 (24\" o.c.) 60', described as 'Double 38 mm x 89 mm ... wood studs ... on separate 38 mm x 89 mm ... wood plates set 25 mm (1\") apart; single layer 15.9 mm (5/8\") type \"x\" gypsum board each side; two thicknesses'; one batt (SLDWS257) 54. Matches NRC, Warnock, CBD-239 'Factors Affecting Sound Transmission Loss', 1985 (https://web.mit.edu/parmstr/Public/NRCan/CanBldgDigests/cbd239_e.html), Table 2: 'Double row of 38 x 89 mm wood studs with small gap between them', 1+1 layers, 57 with absorbent"
  stc_double_stud_2layer:
    value: 60
    low: 55
    high: 64
    unit: STC, double row of 2x4 wood studs on separate plates 1 in apart, two layers 1/2 in Type X each side, batt in one row, 1 h load-bearing / 1.5 h non-load-bearing (low = no insulation; high = lab test W01480)
    conf: high
    source: "Owens Corning guide (above), 'Double Layer Double Wood Stud Wall': 'NBC-W15e (16\" o.c.) 60', 'W01480 (16\" o.c.) 64'; no insulation 'NBC-W15h ... 55'. CBD-239 Table 2 (above): double row, 2+2 layers, 63 with absorbent, 57 without. WoodWorks 2014 (above): 'with a wider double stud system the assembly achieves a rating of STC 63 (assuming batt insulation in each stud cavity and two layers of 5/8-inch gypsum board on both sides of the wall)'"
  stc_double_stud_no_absorber:
    value: 45
    low: 45
    high: 46
    unit: STC, double row of wood studs, one layer gypsum each side, empty cavities (shows what the batts are worth)
    conf: high
    source: "Owens Corning guide (above): 'NBC-W13e ... 45' and 'NRC-TL-93-261 16\" 45' (5/8 in Type X, no insulation). CBD-239 Table 2: 1+1 layers without absorbent '[46]'"
  stc_double_stud_misdetailed:
    value: 48
    low: 48
    high: 58
    unit: STC, the same double-stud materials with the board or sheathing placed in the middle of the cavity (four-leaf wall, as when two separately sheathed walls stand back to back)
    conf: medium
    source: "WoodWorks 2014 (above): 'a wall that commonly separates luxury units could go from STC 63 to STC 48 and not even meet building code requirements'; Figure 6 'Effect of Sheathing Placement on Acoustical Performance' shows STC 58, 53, 48 and 63 for the same materials in different positions; 'In the case of lot-line walls for townhouses or row housing, the air space is typically sealed air tight. In the case of trapped air, one to two inches of air becomes very stiff'"
  irc_rated_wall_below_fsd:
    value: 5
    low: 3
    high: 5
    unit: ft, exterior walls closer than this fire separation distance must be 1-hour rated with exposure from both sides (value = IRC 2021 Table R302.1(1), unsprinklered; low = Table R302.1(2), sprinklered dwellings)
    conf: high
    source: "IRC 2021 as adopted without amendment by Colorado DFPC, on UpCodes (https://up.codes/viewer/colorado/irc-2021/chapter/3/building-planning): Table R302.1(1) Walls 'Fire-resistance rated' '1 hour—tested in accordance with ASTM E119, UL 263 or Section 703.3 ... with exposure from both sides' at '0 feet'; 'Not fire-resistance rated' '0 hours' at '≥ 5 feet'. Table R302.1(2) (sprinklered): not rated '0 hours' at '3 feet'"
  irc_openings_none_below_fsd:
    value: 3
    low: 3
    high: 3
    unit: ft, no openings in an exterior wall closer than this fire separation distance (both tables)
    conf: high
    source: "UpCodes IRC 2021 (above), Table R302.1(1) and R302.1(2): 'Openings in walls' 'Not allowed' 'NA' '< 3 feet'"
  irc_openings_max_pct_3_to_5ft:
    value: 25
    low: 25
    high: 100
    unit: percent of wall area allowed as openings at fire separation distance 3 ft to < 5 ft (value = unsprinklered; high = sprinklered, 'Unlimited' from 3 ft); unlimited at 5 ft and over in both tables
    conf: high
    source: "UpCodes IRC 2021 (above), Table R302.1(1): 'Openings in walls' '25% maximum of wall area' '0 hours' '3 feet'; 'Unlimited' '0 hours' '5 feet'. Table R302.1(2): 'Unlimited' '0 hours' '3 feet'. Confirms the brief: 1-hour below 5 ft, no openings below 3 ft, 25% from 3 to 5 ft"
  irc_projections_none_below_fsd:
    value: 2
    low: 2
    high: 2
    unit: ft, no projections (eaves, overhangs) closer than this fire separation distance; from 2 ft to < 5 ft they need 1-hour underside protection, heavy timber or fire-retardant-treated wood (3 ft with sprinklers); unrated at 5 ft and over (3 ft with sprinklers)
    conf: high
    source: "UpCodes IRC 2021 (above), Table R302.1(1): 'Projections' 'Not allowed' 'NA' '< 2 feet'; 'Fire-resistance rated' '1 hour on the underside, or heavy timber, or fire-retardant-treated wood' '≥ 2 feet to < 5 feet'; footnotes allow 0 hours on the eave underside 'if fireblocking is provided from the wall top plate to the underside of the roof sheathing'"
  irc_penetrations_protect_below_fsd:
    value: 3
    low: 3
    high: 3
    unit: ft, penetrations closer than this fire separation distance must comply with R302.4 (none required at 3 ft and over)
    conf: high
    source: "UpCodes IRC 2021 (above), Table R302.1(1): 'Penetrations' 'All' 'Comply with Section R302.4' '< 3 feet'; 'None required' '3 feet'"
  irc_townhouse_common_wall_hours:
    value: 2
    low: 1
    high: 2
    unit: hours, fire-resistance of a single common wall between townhouse units, rated from both sides (value = without sprinklers; low = with a P2904 sprinkler system). Alternative under R302.2.1 is two separate 1-hour walls
    conf: high
    source: "UpCodes IRC 2021 (above), R302.2.2 item 1: 'Where an automatic sprinkler system in accordance with Section P2904 is provided, the common wall shall be not less than a 1-hour fire-resistance-rated wall assembly'; item 2: 'Where an automatic sprinkler system ... is not provided, the common wall shall be not less than a 2-hour fire-resistance-rated wall assembly'. R302.2.1: 'Each townhouse unit shall be separated from other townhouse units by two 1-hour fire-resistance-rated wall assemblies'. The sprinklered 1-hour common wall is in the 2021 text"
  irc_two_family_separation_hours:
    value: 1
    low: 0.5
    high: 1
    unit: hours, wall and floor separation between the two units of a two-family dwelling (a pair of attached units is a duplex, not a townhouse; low = fully sprinklered)
    conf: high
    source: "UpCodes IRC 2021 (above), R302.3: 'Dwelling units in two-family dwellings shall be separated from each other by wall and floor assemblies' of 1-hour rating; Exception 1: 'A fire-resistance rating of 1/2 hour shall be permitted in buildings equipped throughout with an automatic sprinkler system'. Definitions (https://up.codes/viewer/colorado/irc-2021/chapter/2/definitions): Townhouse 'A building that contains three or more attached townhouse units'; Dwelling 'Any building that contains one or two dwelling units'"
  irc_parapet_height:
    value: 30
    low: 30
    high: 30
