    conf: high
    source: "25 Pa. Code 287.342(f) (https://www.law.cornell.edu/regulations/pennsylvania/25-Pa-Code-SS-287-342): certification starts the '10-year bond liability period following final closure'; (c): no certification unless 'No further remedial action, maintenance or other activity by the operator is necessary'; (i): DEP can require more remediation on 'a change in land use from a nonresidential to a residential use'"
