    source: "25 Pa. Code 288.234(a)(1) (https://www.law.cornell.edu/regulations/pennsylvania/25-Pa-Code-SS-288-234): 'The cap may be no more permeable than 1.0 x 10-7 cm/sec.' Homer City's cap uses geosynthetics: DEP letter 2026-01-27, permit 300491, accepts 'alternate cap geosynthetics materials including HDPE and LLDPE Microdrain liner manufactured by Agru' under 'permit 300491, condition 22.C' (https://files.dep.state.pa.us/RegionalResources/NWRO/NWROPortalFiles/Homer-City/Waste/homer-city-geosynthetics-approval-letter.pdf)"
  pa_cover_soil_ft:
    value: 2
    low: 2
    high: 2
    unit: ft, minimum cover soil above the cap on a PA residual waste landfill (the depth available for rootzone, drainage and heating pipes without touching the cap)
    conf: high
    source: "25 Pa. Code 288.234(f)(4): 'The layer of cover soil shall be at least 2 feet in thickness.'; (a)(3): 'The layer of material shall support vegetation and protect the cap.'"
  pa_final_slope_min_pct:
    value: 3
    low: 3
    high: 33
    unit: percent grade of the final surface (value/low = minimum; high = maximum allowed slope)
    conf: high
    source: "25 Pa. Code 288.234(h)(1): 'The grade of the final surface of the facility may not be less than 3%.'; (h)(3): 'An operator may not leave final slopes that have a grade exceeding 33%'. A pitch needs ~0.5-1% (fields group): a level field means added fill or a terrace, which DEP would have to approve"
  pa_final_cover_deadline_yr:
    value: 1
    low: 1
    high: 1
    unit: years after the last lift to place final cover (DEP may allow longer for settlement)
    conf: high
    source: "25 Pa. Code 288.234(d): 'The operator shall place final cover within 1 year after disposal in the final lift ceases' 'or as soon thereafter as weather permits.'"
  pa_bond_liability_after_certification_yr:
    value: 10
    low: 10
    high: 10
