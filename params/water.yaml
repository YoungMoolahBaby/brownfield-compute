# Pass 2f: the campus's water budget, from Two Lick Reservoir through the plant to the creeks
# (src/brownfield/water.py). The gas plant's permit inputs (intake, blowdown, the 11 cfs release) are in
# params/creek.yaml; the data centers' water comes from pass 2's module models at the scorecard's
# campus load (params/scorecard.yaml).

reservoir:
  capacity_acft:
    value: 16240
    low: 13000
    high: 16240
    unit: acre-ft of storage the plant can draw on
    conf: medium
    source: "USGS water data reports for 03042500 (WDR PA-01-3, PA-02-3), REMARKS: 'Two Lick Creek Reservoir 10 mi upstream, capacity, 16,240 acre-ft'. The National Inventory of Dams lists 23,000 acre-ft (PA00285, its maximum storage, to the dam's crest). Low: judgement, if ~20% sits below the outlet or is held for water quality; the operating rules are not public"
  drainage_mi2:
    value: 74.0
    unit: mi2 draining to the dam
    conf: high
    source: "National Inventory of Dams PA00285 (Two Lick Creek dam), via the geoconnex reference feature: 191.66 km2 (NHDPlus 192.17)"
  surface_acres:
    value: 510
    low: 450
    high: 510
    unit: acres of water surface when full
    conf: medium
    source: "National Inventory of Dams PA00285 (surface area 510 acres, as mirrored by a dam-safety listing); smaller as the reservoir draws down (low)"
  evaporation_in_yr:
    value: 30
    low: 26
    high: 34
    unit: inches a year evaporated from the water surface
    conf: placeholder
    source: "judgement: free-water-surface evaporation in west-central Pennsylvania is roughly 28-32 in a year (NOAA Technical Report NWS 33 maps, Farnsworth, Thompson and Peck 1982; not read here); rain on the lake is left out, so this overstates the net loss"
  evaporation_may_oct_share:
    value: 0.75
    low: 0.7
    high: 0.8
    unit: share of the year's evaporation that falls May-October (spread evenly within each half)
    conf: placeholder
    source: "judgement: lake evaporation in the northeastern US runs mostly from May to October"
  pass_by_cfs:
    value: 11
    unit: cfs left flowing in Two Lick Creek below the plant's intake
    conf: medium
    source: "NPDES renewal application (GAI for HCG, May 2026), narrative p.7: Q7-10 at Outfall 001 'determined to be 11 cfs based on the requirement to maintain this flow over the Two Lick dam located downstream of the HCGS intake'; the requirement is Consent Order and Agreement Docket No. 81-060-W, 'Two Lick Dam (flow requirements)' (application's permit list). The order itself is not posted"
  min_release_cfs:
    value: 3.4
    low: 0
    high: 11
    unit: cfs the reservoir releases at its own dam whatever the plant needs
    conf: placeholder
    source: "No release rule at the reservoir's dam is public; the 11 cfs applies at the low dam below the intake (pass_by_cfs). Here: at least what Pennsylvania American Water draws just below it for Indiana, ~2.2 MGD (Indiana Gazette via Yahoo News, 2026); high: if the reservoir's dam must also pass 11 cfs"

gauges:
  graceton_mi2:
    value: 171
    unit: mi2 above USGS 03042500, Two Lick Creek at Graceton
    conf: high
    source: "USGS water data report 03042500 (WDR PA-02-3): DRAINAGE AREA 171 mi2; flow regulated since December 1968 by Two Lick Creek Reservoir and since July 1971 by Yellow Creek Lake"
  blacklick_mi2:
    value: 193
    unit: mi2 above USGS 03042000, Blacklick Creek at Josephine
    conf: high
    source: "USGS site file 03042000: 193 mi2 (StreamStats 192)"

coal:
  max_gpm_per_mw:
    value: 14
    unit: gallons a minute per MW, the coal plant's maximum intake rate
    conf: high
    source: "Homer City Generation fact sheet on campus water usage (October 2026): '14 gpm/MW' for the coal plant against 5.9 for the new plant"

gas:
  mw:
    value: 4500
    low: 4000
    high: 4500
    unit: MW the gas plant generates at full output
    conf: medium
    source: "HCR: 'up to 4.5 GW' from seven GE Vernova 7HA.02 turbines (Business Wire, 2025-04-02); seven 1x1 blocks at ~573 MW each make ~4.0 GW (Keentel's 7HA.02 table, third party), so 4.5 GW may include duct firing"
  max_gpm_per_mw:
    value: 5.9
    unit: gallons a minute per MW, the gas plant's maximum intake rate
    conf: high
    source: "Homer City Generation fact sheet on campus water usage (October 2026): '5.9 gpm/MW'"
  efficiency:
    value: 0.62
    low: 0.60
    high: 0.634
    unit: net electric efficiency (LHV) at full output
    conf: medium
    source: "7HA.02 in 1x1 combined cycle: 63.4% net LHV (Keentel table, third party), 61.7% (GE catalog via DirectIndustry); hot days, ageing and duct firing lower it (low)"
  stack_loss_share:
    value: 0.07
    low: 0.05
    high: 0.10
    unit: share of the fuel's heat (LHV) leaving up the stacks
    conf: low
    source: "judgement: heat-recovery stacks at ~80-90 C; textbook combined-cycle heat balances put stack losses at 5-10% of fuel"
  other_loss_share:
    value: 0.025
    low: 0.015
    high: 0.035
    unit: share of the fuel's heat lost elsewhere (generators, transformers, auxiliaries, radiation)
    conf: low
    source: "judgement"
  cycles:
    value: 5
    low: 3.5
    high: 6
    unit: cycles of concentration in the gas plant's mechanical draft towers (blowdown = evaporation / (cycles - 1))
    conf: medium
    source: "ASA, 'Information to support Clean Water Act 316(b) BTA determination' (Feb 2026; NPDES renewal application Att. 9) p.5-1: 'The MDCTs are expected to be operated at 5 cycles of concentration' (the coal plant's towers ran at ~3). Low: DEP's 6.84 MGD of blowdown against the condensers' evaporation"
  output_share:
    value: 1.0
    low: 0.8
    high: 1.0
    unit: share of full output the gas plant runs at through a drought
    conf: placeholder
    source: "full output, as DEP's design intake assumes; 0.8 is the campus alone at 3,000 MW of IT and a total PUE of ~1.2 (3.6 of 4.5 GW)"

# The station's own water balance as filed with DEP: NPDES renewal application (GAI for HCG, May 2026;
# DEP's Homer City page, "NPDES Renewal Application"), Attachment 7, drawing D-352-1801 rev 29, "Figure 1,
# NPDES Permit - Proposed Water Balance/Sampling Diagram". Its note: "All flows are design maximums unless
# otherwise noted." The gallons a minute balance at the intake (396 + 1,400 + 23,851 + 455 = 26,102).
filed:
  intake_gpm:
    value: 26100
    unit: gpm from Two Lick Creek at design maximum (37.6 MGD)
    conf: high
    source: "D-352-1801: 'Two Lick Creek intake 26,100 GPM 37.6 MGD'; ASA 316(b) report p.3-3: four 8,700 gpm pumps, 'at most, three pumps operate at any one time', 'the three pumps together draw a maximum of 26,100 gpm or 37.6 MGD'; the intake 'will not be modified' (renewal narrative p.10), pumps 'replaced in-kind'"
  screen_wash_gpm:
    value: 396
    unit: gpm of intake screen backwash returned to Two Lick Creek (Outfall 002)
    conf: high
    source: "D-352-1801: Outfall 002, screen wash, Two Lick Creek, 396 GPM, 0.57 MGD"
  tenant_makeup_gpm:
    value: 1400
    unit: gpm of treated water to the tenant's (the data centers') cooling equipment
    conf: high
    source: "D-352-1801: 'Tenant cooling equipment makeup 1,400 GPM 2.88 MGD'. 2.88 MGD would be 2,000 gpm; 1,400 gpm is the figure that balances the intake"
  tenant_return_gpm:
    value: 400
    unit: gpm the tenant's cooling equipment returns to the station's towers
    conf: high
    source: "D-352-1801: 'Tenant cooling equipment return 400 GPM 0.58 MGD', into the cooling towers and the blowdown sump"
  towers_service_gpm:
    value: 23851
    unit: gpm of treated water to the station's cooling towers and service water users
    conf: high
    source: "D-352-1801: 'Cooling tower and service water users 23,851 GPM 34.35 MGD'"
  demin_gpm:
    value: 455
    unit: gpm of demineralised water (boiler makeup)
    conf: high
    source: "D-352-1801: 'Demin water users 455 GPM 0.65 MGD'"
  outfall_027_gpm:
    value: 4750
    unit: gpm of tower blowdown to Blacklick Creek (Outfall 027)
    conf: high
    source: "D-352-1801: Outfall 027, 4,750 GPM, 6.84 MGD, Blacklick Creek"
  outfall_001_gpm:
    value: 3000
    unit: gpm to Two Lick Creek at Outfall 001, August-June (blowdown with treated landfill leachate and site water)
    conf: high
    source: "D-352-1801: Outfall 001, '3,000 GPM (August-June) 4.32 MGD', Two Lick Creek, below the low dam (316(b) report p.5-1)"
  outfall_001_july_gpm:
    value: 1900
    unit: gpm to Two Lick Creek at Outfall 001 in July
    conf: high
    source: "D-352-1801: Outfall 001, '1,900 GPM (July) 2.74 MGD'"
