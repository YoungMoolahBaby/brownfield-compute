# Pass 3: the first house of the neighbourhood (forge/, CortenForge) and its heat. Envelope areas
# come from forge's out/pass3/house.json; these are the assemblies, air and loads.

envelope:
  wall_u:
    value: 0.060
    low: 0.045
    high: 0.060
    unit: Btu/h ft2 F, above-grade wood-frame wall U-factor
    conf: medium
    source: "2018 IECC Table R402.1.4, climate zone 5: frame wall U-0.060 (R-20 or R-13+5), as adopted in Pennsylvania's UCC (Lebanon County residential energy worksheet: Central (5) 'R 49 / 20 or 13+5'); low end 2021 IECC U-0.045 (R-20+5)"
  window_u:
    value: 0.30
    low: 0.25
    high: 0.30
    unit: Btu/h ft2 F, fenestration U-factor
    conf: medium
    source: "2018 IECC zone 5 and the Lebanon County worksheet: U-0.30; PA-Alt worksheet lists 0.25-0.27 for some paths (low end)"
  door_u:
    value: 0.20
    low: 0.15
    high: 0.35
    unit: Btu/h ft2 F, opaque entry doors
    conf: placeholder
    source: "judgement: insulated steel or fibreglass doors"
  ceiling_u:
    value: 0.026
    low: 0.024
    high: 0.026
    unit: Btu/h ft2 F, ceiling under a vented attic
    conf: medium
    source: "2018 IECC zone 5 U-0.026 (R-49; Lebanon County worksheet R-49); 2021 IECC U-0.024 (R-60)"
  slab_f:
    value: 0.6
    low: 0.45
    high: 0.9
    unit: Btu/h ft F, F-factor of a heated (radiant) slab per foot of perimeter, insulated at the edge and underneath
    conf: placeholder
    source: "judgement, to source (ASHRAE 90.1 Appendix A heated-slab F-factors); a radiant slab loses more than an unheated one, so this is set above an unheated R-10 slab's"
air:
  ach50:
    value: 3.0
    low: 1.5
    high: 3.0
    unit: air changes an hour at 50 Pa (blower door)
    conf: medium
    source: "IECC 2018 R402.4.1.2: no more than 3 ACH50 in climate zones 3-8 (code maximum = high end); 1.5 a tight new house"
  n_factor:
    value: 20
    low: 15
    high: 25
    unit: ACH50 / natural ACH
    conf: medium
    source: "the LBL rule of thumb, natural infiltration ~ ACH50 / 20 (15-25 by exposure and height)"
  bedrooms:
    value: 2
    unit: bedrooms (sets the ventilation rate)
    conf: high
    source: "the D1 house's plan, 2 bedrooms in 24 x 40 ft"
  hrv_eff:
    value: 0
    low: 0
    high: 0.8
    unit: heat recovered from the ventilation air (0 = code minimum, no heat recovery ventilator)
    conf: high
    source: "a design choice; code doesn't require heat recovery in zone 5; 0.7-0.8 for a good HRV"
loads:
  indoor_c:
    value: 20
    unit: C, indoor set point
    conf: high
    source: "convention for heating design (ACCA Manual J uses 70 F)"
  design_c:
    value: -16.8
    low: -20
    high: -14
    unit: C, outdoor heating design temperature (99.6%)
    conf: medium
    source: "ASHRAE Handbook (2005) via a compiled table: Pittsburgh, PA 99.6% heating dry bulb 1.8 F = -16.8 C; the typical year at the plant reaches -13.9 C"
  internal_w:
    value: 600
    low: 400
    high: 800
    unit: W of internal and solar gains on average in the heating season (sets the balance point)
    conf: placeholder
    source: "judgement: people, appliances, lights, some winter sun for a 2-bedroom house"
  hot_water_mwh:
    value: 3.0
    low: 2.0
    high: 4.0
    unit: MWh of heat a year for hot water per home
    conf: placeholder
    source: "judgement, to source (RECS water heating)"
radiant:
  max_floor_c:
    value: 29
    unit: C, highest floor surface temperature in occupied areas
    conf: high
    source: "EN 1264 'physiologically agreed' maximum, 9 K above a 20 C room (supplier summaries of BS EN 1264); 35 C allowed at the perimeter zone"
  k_h:
    value: 6.0
    low: 4.5
    high: 7.5
    unit: W/m2K, heat out of the floor per kelvin of mean water temperature above the room (the system's characteristic)
    conf: placeholder
    source: "judgement for pipes in a concrete slab under tile or thin flooring, to source (EN 1264-2 system tests); carpet would lower it"
  dt_k:
    value: 6
    low: 4
    high: 10
    unit: K, supply minus return across the floor loops at design
    conf: placeholder
    source: "judgement: radiant floors run small differences"

# Step 3: a block of new homes on the data center's warm loop (A) against each home heating itself
# with a heat pump (B) or gas (C). Per home, US dollars; cooling included in all three so they
# compare like for like (a radiant slab can't cool, so A adds an air conditioner).
block:
  homes:
    value: 200
    low: 50
    high: 500
    unit: homes on the block
    conf: placeholder
    source: "a design choice; the share of the main per home falls with it"
  main_km:
    value: 1.5
    low: 0.5
    high: 3.0
    unit: km of main from the data center's loop to the block
    conf: placeholder
    source: "judgement: homes stand ~20 m from the campus edge today (pass 2c), so a block can sit next to it; the loop's heat exchanger is inside"
  main_usd_m:
    value: 1100
    low: 700
    high: 1600
    unit: USD per metre of main (supply and return, ~DN150 for ~1 MW)
    conf: placeholder
    source: "judgement, scaled down from ~2,100-2,500 EUR/m for DN400-500 rural pipe (cost model via search) to a pipe a third the size; to source"
  street_usd_m:
    value: 500
    low: 250
    high: 900
    unit: USD per metre of street network (small twin pipe, laid in trenches dug for the other utilities)
    conf: placeholder
    source: "no per-metre figure found; new-build networks share open trenches with water, sewer, power and telecom (REHAU), which cuts civil cost; to source"
  plant_usd_kw:
    value: 200
    low: 100
    high: 400
    unit: USD per kW of peak heat for the heat exchanger and pumps at the data center
    conf: placeholder
    source: "judgement, to source"
  om_share:
    value: 0.015
    low: 0.01
    high: 0.025
    unit: share of network capex a year for operation and maintenance
    conf: placeholder
    source: "judgement, to source"
  pump_share:
    value: 0.02
    low: 0.01
    high: 0.04
    unit: pumping electricity as a share of the heat delivered
    conf: placeholder
    source: "judgement: 1-4% for district heating networks, to source"
density:
  # Street frontage per dwelling (m): detached houses, townhouses, apartment buildings.
  detached_m:
    value: 20
    low: 15
    high: 30
    unit: m of street network per detached house
    conf: placeholder
    source: "judgement: a small lot's frontage"
  townhouse_m:
    value: 7
    low: 5
    high: 9
    unit: m of street network per townhouse
    conf: placeholder
    source: "judgement: a townhouse's width"
  apartment_m:
    value: 2.54
    low: 1.5
    high: 4
    unit: m of street network per apartment (one connection serves a building)
    conf: medium
    source: "forge's walk-up (pass 3b): 100 ft of frontage for 12 flats = 2.54 m; taller or deeper buildings less (low), a corner lot more (high)"
loop_home:
  radiant_usd_ft2:
    value: 8
    low: 6
    high: 12
    unit: USD per square foot of in-slab radiant floor (tubing, manifold, insulation; no boiler)
    conf: low
    source: "consumer and contractor guides: slab-on-grade hydronic $6-12/sq ft plus boiler (here no boiler: the loop is the source); This Old House/Angi $6-20"
  hiu_usd:
    value: 2500
    low: 1500
    high: 4000
    unit: USD per home for the connection (heat exchanger or direct manifold, valves, meter, controls)
    conf: placeholder
    source: "judgement: simpler than a retrofit HIU ($2,500-12,000, pass 2b) because there is no conversion and no high temperature"
  booster_usd:
    value: 2200
    low: 1700
    high: 5500
    unit: USD per home for a small water-to-water heat pump lifting the loop to hot water
    conf: low
    source: "priced like a heat pump water heater: DOE 2024 standards analysis $2,164 installed (via a calculator); range $1,700-5,500"
  booster_cop:
    value: 4.0
    low: 3.0
    high: 5.0
    unit: COP lifting ~45 C loop water to ~55-60 C hot water
    conf: placeholder
    source: "judgement: a small lift from a warm source; above an air-source HPWH's UEF 3.35 (DOE)"
  ac_usd:
    value: 5000
    low: 3500
    high: 8000
    unit: USD per home for cooling (a radiant slab can't cool) - also added to the gas option
    conf: placeholder
    source: "judgement: a ductless or central AC unit, to source"
heat_pump_home:
  ashp_usd:
    value: 16000
    low: 12000
    high: 24000
    unit: USD per home for a ducted cold-climate heat pump with ducts (heats and cools)
    conf: low
    source: "vendor guide (pickhvac): ducted systems with new or upgraded ductwork $14,000-24,000; a small new house at the lower part"
  scop:
    value: 2.6
    low: 2.2
    high: 3.3
    unit: seasonal heating COP
    conf: medium
    source: "British Columbia cold-climate field study (RDH 2021): central single-stage 2.6, central variable-speed 3.3, ductless 2.4; NEEP-region cold snaps >2.0 (Cadmus)"
  hpwh_usd:
    value: 2164
    low: 1700
    high: 5500
    unit: USD for a heat pump water heater installed
    conf: low
    source: "DOE 2024 water heater standards analysis, $2,164 installed (via a calculator); guides $1,700-5,500"
  hpwh_uef:
    value: 3.35
    low: 2.8
    high: 3.8
    unit: uniform energy factor of the heat pump water heater
    conf: medium
    source: "DOE's modelled heat pump water heater 3.35 at typical use (via the same calculator)"
gas_home:
  furnace_usd:
    value: 6000
    low: 4000
    high: 9000
    unit: USD for a gas furnace with ducts in a small new house
    conf: placeholder
    source: "judgement, to source"
  gas_line_usd:
    value: 2000
    low: 1000
    high: 4000
    unit: USD for the gas service line and meter
    conf: placeholder
    source: "judgement, to source"
  wh_usd:
    value: 1570
    low: 1200
    high: 3000
    unit: USD for a gas tank water heater installed
    conf: low
    source: "DOE 2024 standards analysis $1,570 installed (via a calculator); guides $1,200-3,000"
  wh_uef:
    value: 0.58
    low: 0.58
    high: 0.67
    unit: uniform energy factor of a gas tank water heater
    conf: medium
    source: "DOE's modelled gas tank 0.58; a standard tank UEF 0.67 (guides)"
  furnace_eff:
    value: 0.95
    low: 0.9
    high: 0.97
    unit: furnace efficiency (AFUE)
    conf: medium
    source: "new condensing furnaces 90-97% AFUE"
  fixed_usd_month:
    value: 15
    low: 10
    high: 25
    unit: USD a month gas customer charge
    conf: placeholder
    source: "judgement, to source (PA gas utility tariffs)"
prices:
  res_elec_usd_mwh:
    value: 193
    low: 170
    high: 230
    unit: USD per MWh, Pennsylvania residential electricity
    conf: medium
    source: "AGA Pennsylvania residential energy cost analysis (Aug 2026): EIA-reported PA residential average 19.30 c/kWh in 2025; rising (high end)"

# Pass 3b, step 3: the walk-up's wood frame (src/brownfield/frame.py). Loads and design choices;
# lumber and I-joist design values are tables in the code, with their sources.
frame:
  floor_live_psf:
    value: 40
    unit: psf, uniform live load on the flats' floors
    conf: high
    source: "IBC 2018 Table 1607.1 / ASCE 7-16 Table 4.3-1: residential, all other residential occupancies, private rooms and corridors serving them, 40 psf (IBC interpretation 37-07: apartments' private corridors 40 psf; public corridors 100)"
  floor_dead_psf:
    value: 15
    low: 12
    high: 18
    unit: psf, floor dead load without the topping (joists, 23/32 subfloor, finish floor, resilient channel and two layers of 5/8 in. type X gypsum below, insulation, services)
    conf: placeholder
    source: "judgement: span tables use 10 psf for joists, subfloor and a light ceiling; a 1-hour fire- and sound-rated floor between flats adds a second gypsum layer and channels"
  partition_psf:
    value: 8
    low: 0
    high: 15
    unit: psf, allowance for the flats' interior partitions
    conf: placeholder
    source: "judgement: IBC 1607.5 requires 15 psf only where partitions may move (offices); fixed wood-stud partitions in flats are commonly carried as a smaller dead load"
  topping_in:
    value: 1.5
    low: 0.75
    high: 2.0
    unit: in., gypsum concrete over the subfloor that holds the radiant tubing (upper floors)
    conf: low
    source: "Maxxon (Gyp-Crete over wood): 3/4 in. is the usual pour over wood; 1/2 in. PEX tubing needs ~1-1/2 in. of cover (installer forum, not authoritative)"
  topping_pcf:
    value: 115
    low: 110
    high: 120
    unit: lb/ft3, dry density of the gypsum topping
    conf: high
    source: "Maxxon Gyp-Crete Radiant sell sheet: dry density 110-120 lbs/ft3"
  roof_dead_psf:
    value: 15
    low: 12
    high: 20
    unit: psf, flat roof dead load (membrane, tapered insulation, sheathing, joists, ceiling)
    conf: placeholder
    source: "judgement, to source"
  roof_live_psf:
    value: 20
    unit: psf, roof live load (maintenance)
    conf: high
    source: "ASCE 7-16 Table 4.3-1: ordinary flat roofs 20 psf"
  ground_snow_psf:
    value: 35
    low: 30
    high: 40
    unit: psf, ground snow load at Homer City
    conf: medium
    source: "Indiana County Office of Planning & Development, commercial building permit guidance (icopd.org): 'Ground Snow Load is 35 lbs. per square foot'; ASCE 7-22 site values would differ"
  snow_ce:
    value: 1.0
    low: 0.9
    high: 1.1
    unit: exposure factor
    conf: medium
    source: "ASCE 7-16 Table 7.3-1, partially exposed roof (1.0); fully exposed in open country 0.9, sheltered 1.1 (from memory, to confirm)"
  snow_ct:
    value: 1.0
    low: 1.0
    high: 1.1
    unit: thermal factor
    conf: medium
    source: "ASCE 7-16 Table 7.3-2: heated structures 1.0; 1.1 for cold, ventilated roofs with R > 25 between the ventilated space and the heated space (from memory, to confirm)"
  wall_wind_psf:
    value: 25
    low: 18
    high: 35
    unit: psf, strength-level wind pressure on the facade studs (components and cladding)
    conf: low
    source: "judgement from ASCE 7-16 components and cladding at V = 115 mph (Indiana County: 90-115 mph by exposure), mean roof height 30 ft, exposure B-C: qh ~20-28 psf times |GCp - GCpi| ~1.2-1.5 for wall zones 4-5; to compute properly; ASD uses 0.6 of it"
  wall_dead_psf:
    value: 12
    low: 10
    high: 15
    unit: psf of wall, exterior and party walls (studs, sheathing, insulation, gypsum, cladding)
    conf: placeholder
    source: "judgement, to source"
  soil_psf:
    value: 1500
    low: 1500
    high: 3000
    unit: psf, allowable soil bearing pressure
    conf: medium
    source: "IBC 2018 Table 1806.2 presumptive load-bearing value, class 5 soils (clay, sandy clay, silty clay, clayey silt) 1,500 psf (from memory, to confirm); a site investigation would set it"
  frost_in:
    value: 36
    unit: in., frost depth (footing depth below grade)
    conf: high
    source: "Indiana County Office of Planning & Development permit guidance: 'Frost Line Depth - 36 inches'"
  spacing_in:
    value: 16
    low: 12
    high: 24
    unit: in., spacing of joists and studs (in-line framing)
    conf: high
    source: "a design convention: 16 in. on centre suits 4 x 8 ft sheathing and gypsum; 24 in. is 'advanced framing'"
  floor_live_defl:
    value: 480
    low: 360
    high: 480
    unit: span / limit, live-load deflection of floor joists
    conf: medium
    source: "IBC 2018 Table 1604.3: floor members L/360 minimum; L/480 is APA's criterion for I-joist floors and usual under a gypsum topping and tile"

# Pass 3b: the build sequence (forge `build`, sim-core): walls framed flat and tilted up in
# panels, then cap plates, joists and rims set on what's built.
build:
  wood_g:
    value: 0.42
    low: 0.40
    high: 0.44
    unit: specific gravity of the framing lumber (oven-dry weight, volume at 12% moisture)
    conf: medium
    source: "NDS 2018 Table 12.3.3A: Spruce-Pine-Fir G = 0.42 (from memory, to confirm)"
  wood_mc:
    value: 15
    low: 12
    high: 19
    unit: "% moisture content when framed"
    conf: medium
    source: "kiln-dried framing lumber is graded at 19% or less (S-DRY); it dries further on site"
  osb_psf:
    value: 1.4
    low: 1.3
    high: 1.6
    unit: psf, 7/16 in. OSB wall sheathing, nailed on while the panel lies flat
    conf: placeholder
    source: "judgement: OSB at ~38-44 lb/ft3 x 7/16 in.; to source"
  crew_lift_lbf:
    value: 51
    low: 35
    high: 51
    unit: lbf a worker should be asked to lift
    conf: medium
    source: "NIOSH Revised Lifting Equation (Waters et al., Ergonomics 1993; Applications Manual 1994): load constant 51 lb, the recommended limit in ideal conditions; lifting a wall from the floor is far from ideal, so this is the most (high end)"
  crew_max:
    value: 6
    low: 4
    high: 8
    unit: workers who can get hands on one panel's top plate at once
    conf: placeholder
    source: "judgement: beyond this a wall jack or a crane lifts the panel"
  panel_max_ft:
    value: 16
    low: 10
    high: 24
    unit: ft, the longest wall panel framed flat and raised in one piece
    conf: placeholder
    source: "judgement: crews frame long walls in sections they can raise; to source"

# Pass 3b: the same walk-up in 8 in. concrete block bearing walls with 8 in. hollow-core floors
# (src/brownfield/masonry.py). Plank capacities and self weight are a table in the code.
masonry:
  plank_bearing_in:
    value: 3
    low: 2
    high: 4
    unit: in., plank bearing on the block walls at each end
    conf: placeholder
    source: "judgement: hollow-core on masonry commonly sits on 3-4 in. of bond beam; PCI's minimum is smaller; to source"
  finishes_psf:
    value: 2
    low: 1
    high: 5
    unit: psf, finish floor over the topping (no ceiling below; the planks are painted)
    conf: placeholder
    source: "judgement"
  openings_psf:
    value: 15
    low: 0
    high: 15
    unit: psf added to the floor load for service openings cut in the planks
    conf: medium
    source: "Oldcastle Elematic Hollowcore Technical Guide (2019), load table note 8: 'In residential buildings, add 15+/- psf to your total uniform loading to account for MEP openings in preliminary design'"
  roof_sdl_psf:
    value: 10
    low: 6
    high: 15
    unit: psf on the roof planks (tapered insulation, membrane)
    conf: placeholder
    source: "judgement, to source"
  fm_psi:
    value: 2000
    low: 1500
    high: 2500
    unit: psi, specified compressive strength of the masonry f'm
    conf: medium
    source: "The Masonry Society ASD course examples use 2,000 psi; TMS 602 unit strength method: ~2,000 psi units with type S mortar (from memory, to confirm)"
  an_in2_ft:
    value: 30
    low: 30
    high: 91.5
    unit: in2 per ft of wall, net bedded area of 8 in. block
    conf: medium
    source: "NCMA TEK 14-1B: 8 in. hollow units, face-shell bedded, 30.0 in2/ft (from memory, to confirm; the conservative choice for a partly grouted wall); fully grouted 91.5 (7.625 x 12, TMS course example)"
  r_in:
    value: 2.66
    low: 2.20
    high: 3.21
    unit: in., radius of gyration of the wall
    conf: medium
    source: "TMS ASD course (MDG 2016 ch. 11): partially grouted 8 in. CMU, average r = 2.66 in. per NCMA TEK 14-1B; fully grouted 2.20"
  sn_in3_ft:
    value: 81
    low: 81
    high: 116
    unit: in3 per ft, net section modulus of 8 in. block
    conf: low
    source: "NCMA TEK 14-1B, 8 in. hollow face-shell bedded, ~81 in3/ft (from memory, to confirm); fully grouted 7.625^2 x 12 / 6 = 116"
  cmu_psf:
    value: 50
    low: 40
    high: 60
    unit: psf of wall, 8 in. normal-weight block grouted at 48 in. with its reinforcement
    conf: placeholder
    source: "judgement from NCMA weight tables (TEK 14-13), to confirm"
  block_lb:
    value: 36
    low: 28
    high: 42
    unit: lb, one 8 x 8 x 16 in. block
    conf: placeholder
    source: "judgement: normal-weight 8 in. units ~35-40 lb, lightweight ~28; to source"
