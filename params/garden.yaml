# Pass 3c: the winter garden (D9). Inputs to its heat, its floors, its cantilevers, and (once
# sourced) its cost and carbon (src/brownfield/garden.py). Geometry comes from forge `garden`
# (out/pass3/garden.json).

heat:
  set_low_c:
    value: 12
    low: 10
    high: 14
    unit: C, lowest temperature held in a temperate winter garden
    conf: placeholder
    source: "judgement: temperate glasshouses are kept frost-free to cool (to source)"
  set_high_c:
    value: 18
    low: 16
    high: 20
    unit: C, a warmer garden that people sit in through winter
    conf: placeholder
    source: "judgement (to source)"
  glass_u:
    value: 1.6
    low: 1.1
    high: 2.8
    unit: W/m2K, glazing with its frames (double, low-e, argon; high = plain double)
    conf: placeholder
    source: "judgement (to source)"
  roof_u:
    value: 0.25
    low: 0.18
    high: 0.4
    unit: W/m2K, the concrete trays where they roof a room or sit over the pool, insulated
    conf: placeholder
    source: "judgement: an insulated concrete roof (to source)"
  ach:
    value: 0.7
    low: 0.3
    high: 1.5
    unit: air changes per hour (infiltration and fresh air)
    conf: placeholder
    source: "judgement (to source: glasshouse infiltration)"

cantilever:
  span_m:
    value: 5.5
    unit: m, level 1's terrace beyond the furthest pier (forge `garden`)
    conf: high
    source: "the design (out/pass3/garden.json): tray to y = 18.5 m, pier to 13.0 m"
  depth_mm:
    value: 900
    low: 800
    high: 1000
    unit: mm, tray depth (first drawn at 600 mm, which fails the deflection check; garden.py reports both)
    conf: high
    source: "the design, deepened to meet ACI 318's long-term deflection limit as plain reinforced concrete; post-tensioning (Fallingwater's 2002 repair) would allow a slimmer tray"
  fc_mpa:
    value: 27.6
    low: 24
    high: 35
    unit: MPa, specified concrete strength f'c (4,000 psi)
    conf: medium
    source: "common structural concrete; ACI 318 Ec = 4,700 sqrt(f'c) MPa"
  fy_mpa:
    value: 420
    unit: MPa, reinforcing steel yield (Grade 60)
    conf: high
    source: "ASTM A615 Grade 60"
  cover_mm:
    value: 50
    unit: mm, top of tray to the centre of the top bars
    conf: medium
    source: "ACI 318 Table 20.5.1.3.1: 40 mm clear for slabs exposed to weather plus the bar"
  superimposed_kpa:
    value: 2.5
    low: 1.5
    high: 4.0
    unit: kPa, stone paving, bedding and planters on the terrace
    conf: placeholder
    source: "judgement"
  parapet_kn_m:
    value: 6.8
    unit: kN/m, the 0.3 x 0.95 m concrete parapet at the tip
    conf: high
    source: "derived: 0.3 x 0.95 m x 24 kN/m3"
  live_kpa:
    value: 4.79
    unit: kPa (100 psf), a public terrace (assembly)
    conf: high
    source: "ASCE 7-16 Table 4.3-1: assembly areas, lobbies, balconies serving them, 100 psf"
  creep_xi:
    value: 2.0
    unit: ACI 318 time-dependent factor for sustained load, 5 years or more
    conf: high
    source: "ACI 318-19 Table 24.2.4.1.3"
  sustained_live:
    value: 0.25
    low: 0.0
    high: 0.5
    unit: share of the live load that stays on long enough to creep
    conf: placeholder
    source: "judgement"
  limit_ratio:
    value: 240
    unit: span over this is the allowed long-term deflection of a cantilever not carrying fragile finishes
    conf: high
    source: "ACI 318-19 Table 24.2.2 (L/240 for floors not supporting elements likely to be damaged)"

acoustics:
  deck_m:
    value: 14.0
    unit: m, the data hall's roof deck, where the coolers stand
    conf: high
    source: "the design (forge `garden`)"
  parapet_m:
    value: 3.0
    unit: m of stone parapet above the deck (its top 13 cm below the fans' discharge)
    conf: high
    source: "the design; EVAPCO Layout Manual 320A and BAC Layout Guidelines: a unit's discharge at or above adjacent walls (wall.yaml)"
  parapet_thick_m:
    value: 0.4
    unit: m, the stone parapet's thickness
    conf: high
    source: "the design (forge `garden`)"
  overhang_m:
    value: 2.6
    unit: m, the roof overhang beyond the parapet (a second edge for sound bending down to the ground)
    conf: high
    source: "the design"
  fan_cut_db:
    value: 6
    low: 0
    high: 8
    unit: dB less sound power per fan than pass 2 assumes (88 dB(A), a placeholder), by choosing low-noise fans
    conf: medium
    source: "makers' data via params/wall.yaml's inputs: a 6 x 800 mm Kelvion unit at 94 dB(A) = ~86 a fan; ebm-papst AxiBlade W3G910 (910 mm EC, guide vanes) 80-82 dB(A) at 1,030 rpm (data sheet, 2025), a fan measured free-standing, not in a coil. 88 -> 80-82 = 6-8 dB"
  target_db:
    value: 40
    unit: dB(A), night level outside a home (WHO 2009), as pass 2
    conf: high
    source: "params/pass2.yaml noise.target_night_db"

# The hall's warm basins (D15): twin basins either side of the causeway to the great door, spilling
# over the ledge into twin lower pools; held warm off the chip loop through a heat exchanger (the chip
# loop is closed). Their heat and the water they evaporate (src/brownfield/garden.py, basins).
basin:
  area_m2:
    value: 1272
    unit: m2 of open warm water (two upper basins 26 x 11 m and two lower pools 25 x 14 m)
    conf: high
    source: "the design (forge `garden`, hall_front)"
  water_c:
    value: 20.0
    low: 15.0
    high: 30.0
    unit: C, the basins' water (warm enough to steam on cold days)
    conf: placeholder
    source: "the design: steam fog forms when cold air passes over much warmer water (AMS Glossary of Meteorology, 'steam fog'), so 20 C water steams through a Pennsylvania winter; the chip loop's warm water (~50 C, pass 2) heats the basins through a heat exchanger. Low: the least that would still steam on most winter days; high: a warm pool (judgement)"
  wind_factor:
    value: 0.5
    low: 0.3
    high: 1.0
    unit: wind over the water as a share of PVGIS's wind at 10 m (the forecourt is sheltered by the hall and the pylons)
    conf: placeholder
    source: "judgement: the wind near the ground is weaker than at 10 m (about 0.75 at 2 m by the usual log law over open grass) and the forecourt lies in the lee of a 17 m hall to its north; high: no shelter"
  emissivity:
    value: 0.95
    low: 0.92
    high: 0.97
    unit: long-wave emissivity of a water surface
    conf: high
    source: "Duffie & Beckman, Solar Engineering of Thermal Processes (water ~0.95); standard tables give 0.92-0.97"
