clear_m:
  value: 5
  low: 5
  high: 20
  unit: m kept clear between modules (at least a walk or a fire lane)
  conf: placeholder
  source: "judgement"
standoff_m:
  value: 15.24
  low: 10
  high: 45
  unit: m from the data hall that no public vehicle enters (the landscape band)
  conf: medium
  source: "UFC 4-010-01 (2018, Change 3, May 2024): 15 m (50 ft) to the controlled perimeter; GSA/ISC default for new federal buildings 50 ft (15.24 m). Low: the cancelled 2003 edition's 10 m minimum to an ordinary inhabited building; high: its 45 m conventional figure for a gathering building"
park_center_m2:
  value: 17300
  low: 11000
  high: 20000
  unit: m2 of parking for the community center and the rink (5.11 spaces per 1,000 ft2 x 75,000 + 4.0 per 1,000 ft2 x 48,800 = ~580 spaces x ~30 m2 with aisles; low = shared use between the two)
  conf: medium
  source: "research notes: ITE Parking Generation (6th ed.) community center 5.11/1,000 ft2; a county code's ice rink 4.0/1,000 ft2; 25-35 m2 per space with aisles (my arithmetic)"
park_field_m2:
  value: 600
  low: 400
  high: 1200
  unit: m2 of parking for the field (20 spaces)
  conf: medium
  source: "research notes: a county code's 20 spaces per soccer field x ~30 m2"
park_food_m2:
  value: 4500
  low: 3000
  high: 5300
  unit: m2 of parking for the food court (15 spaces per 1,000 ft2 x 10,000 ft2 = 150 spaces)
  conf: medium
  source: "research notes: fast food 15 spaces per 1,000 ft2 (county code); ~30 m2 per space"
truck_t:
  value: 18
  low: 16
  high: 20
  unit: t of produce per truck (USDA counts produce in 40,000 lb loads; a 53 ft reefer carries up to ~44,000 lb)
  conf: high
  source: "research notes: USDA AMS shipment units of 40,000 lb; reefer payload ~44,000 lb"
hall_trucks_yr:
  value: 6570
  low: 2000
  high: 6570
  unit: trucks a year serving the data hall in operation (18 a day)
  conf: low
  source: "research notes: AWS's Virginia campuses average ~18 truck trips a day each (a campus, not one building: high)"

