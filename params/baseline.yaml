# Pass 3g step 10d (D28): noise and comfort, each walk-up side by side. Only what a maker
# publishes, a study measured or a standard sets; no scores or weights.
comfort:
  ashrae55_floor_min_c:
    value: 19
    unit: C, the least floor surface temperature in the occupied zone
    conf: high
    source: "ASHRAE 55-2010 Addendum f (published, ashrae.org standards addenda: data/raw/pass3g/step10/comfort/ashrae55_2010_f.pdf), 5.2.4.4 Floor Surface Temperature: 'When representative occupants are seated with feet in contact with the floor, floor surface temperatures within the occupied zone shall be 19-29 C (66.2-84.2 F)'; its informative appendix: 'based on people wearing lightweight indoor shoes'. The addendum moved the informative words to that appendix and kept the range as the requirement"
  ashrae55_floor_max_c:
    value: 29
    unit: C, the most floor surface temperature in the occupied zone
    conf: high
    source: "ASHRAE 55-2010 Addendum f, 5.2.4.4 (as ashrae55_floor_min_c); EN 1264's 29 C (pass3.radiant.max_floor_c) is the same"
  lav_gpm:
    value: 2.2
    unit: gpm, a lavatory faucet's flow (the federal most, at 60 psi)
    conf: high
    source: "10 CFR 430.32(o) (eCFR, read 2026-11-23, data/raw/pass3g/step10/comfort/ecfr_430_32.xml): 'when measured at a flowing water pressure of 60 pounds per square inch ... Lavatory faucets 2.2 gpm (8.3 L/min)'. A faucet that flows less waits longer, in proportion, in every walk-up alike"
  sink_gpm:
    value: 2.2
    unit: gpm, a kitchen faucet's flow (the federal most, at 60 psi)
    conf: high
    source: "10 CFR 430.32(o) (as lav_gpm): 'Kitchen faucets 2.2 gpm (8.3 L/min)'"
  shower_gpm:
    value: 2.5
    unit: gpm, the tub's showerhead (the federal most, at 80 psi)
    conf: high
    source: "10 CFR 430.32(p) (as lav_gpm): 'The maximum water use allowed for any showerheads manufactured after January 1, 1994, shall be 2.5 gallons per minute (9.5 liters per minute) when measured at a flowing pressure of 80 pounds per square inch gage'"
