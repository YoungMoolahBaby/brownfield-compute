# Pass 3g step 10c (D28): each walk-up's energy a year (src/brownfield/energy.py). Prices in `tariff`.
energy:
  heat_set_f:
    value: 69.8
    low: 68.4
    high: 70.5
    unit: F, the flats' heating set point through the year
    conf: medium
    source: "RECS 2020 microdata, apartments in buildings of 5+ units (2,218 records), weighted means: winter 'TEMPHOME' 70.5 F, 'TEMPNITE' 69.1, 'TEMPGONE' 68.4; the value the mean of home and night, low gone, high home (the design loads hold 68 F, pass3.loads.indoor_c)"
  cool_set_f:
    value: 71.1
    low: 70.7
    high: 75
    unit: F, the flats' cooling set point
    conf: medium
    source: "RECS 2020 microdata, the same households with air conditioning (2,069 records), weighted means: 'TEMPHOMEAC' 71.4 F, 'TEMPNITEAC' 70.7; the value their mean; high: 75 F, the IECC reference design's (the cooling design's, systems.design.cooling_indoor_f)"
  subadditivity_k:
    value: 0.667
    low: 0.444
    high: 1.0
    unit: the exponent's constant in Hurel, Sherman and Walker's sub-additivity, Qt = Qm + Qinf exp(-k Qu / Qinf)
    conf: medium
    source: "Hurel, Sherman and Walker, 'Sub-additivity in combining infiltration with mechanical ventilation for single zone buildings', Building and Environment 98 (2016), LBNL report (OSTI 1532181, data/raw/pass3g/step10/infil/osti_1532181.pdf): Table 4, 'Short-term [forward] Qt = Qm + Qinf e^(-2Qu/3Qinf)', 'Long-term Qt = Qm + Qinf e^(-4Qu/9Qinf)' (Table 2: forward hourly 2/3, annual 4/9; inverse hourly 1, taken as the high end); 'useful for estimating energy loads' (the hourly forward case). Its limit, p. 17: the data 'did not include attached or multifamily configurations'"
  occupants:
    value: 2.39
    low: 1.99
    high: 3.0
    unit: people in a 2-bedroom flat on average, for the year's hot water
    conf: medium
    source: "FSEC-PF-464-15's multifamily formula as the Ecosizer manual (May 2025) Table 2 gives it, ASHRAE market rate 1.49 + 0.45 per bedroom = 2.39; low: RECS 2020 microdata, 2-bedroom apartments in buildings of 5+ units with their own electric water heater, weighted mean household size 1.99 (357 records); high: 3, Phius's bedrooms + 1 and CTCAC's (the design day's, systems.hot_water.occupants_per_flat)"
  fixture_gpd_per_occ:
    value: 22
    low: 16.6
    high: 27.6
    unit: gallons a day per occupant, times Fmix, of showers, baths and faucets' hot water
    conf: medium
    source: "Parker, Fairey and Lutz, 'Estimating Daily Domestic Hot-Water Use in North American Homes', ASHRAE Transactions AT-15-021 (FSEC-PF-464-15; data/raw/pass3g/dl/dhw/fsec.txt), Eq. 11: 'HWgpd = 22 x (Occ x Fmix) + CWgpd + DWgpd'; Regression A, OccNorm coefficient 22.08, 95% interval 16.6-27.6 (69 single-family homes)"
  tmix_f:
    value: 105
    unit: F, the mixed temperature at a shower or faucet
    conf: medium
    source: "FSEC-PF-464-15 (above): Fmix = 1 - (Tset - Tmix)/(Tset - Tmains), the target 'generally assumed to be 105 F at point of end-use (Tuse)'"
  cw_gal_cycle:
    value: 2.3
    low: 1.5
    high: 4.0
    unit: gal of hot water a clothes-washer cycle
    conf: medium
    source: "FSEC-PF-464-15 (above): 'Standard clothes washer 2008 or later: 4.62 gal per cycle x 0.5 = 2.3'; 'ENERGY STAR clothes washer: 3.0 x 0.5 = 1.5'; standard vintage 4.0; cycles a year 123 + 61 x Occ (Eq. 2)"
  dw_gal_cycle:
    value: 4.4
    low: 4.4
    high: 8.0
    unit: gal of hot water a dishwasher cycle
    conf: medium
    source: "FSEC-PF-464-15 (above): DWgpc = 4.64/EF - 1.9295 (Eq. 4); 'ENERGY STAR unit: 4.4 gallons per cycle' (EF 0.73), 'Base unit: 8.0'; cycles a year 91 + 30 x Occ (Eq. 3)"
  hp_scop:
    value: 3.08
