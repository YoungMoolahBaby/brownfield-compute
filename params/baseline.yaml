# Labour: each trade's mean wage (BLS OEWS May 2025, the Southwestern Pennsylvania nonmetropolitan
# area, which holds Indiana County; series OEUM4200004000000<SOC>03, from BLS's API), its low the
# least of that and the Johnstown MSA's, its high Davis-Bacon's base wage for building work in
# Indiana County (PA20260055 modification 6, 2026-11-12); times the burden.
labour:
  plumber_usd_h:
    value: 29.51
    low: 29.51
    high: 40.02
    unit: USD an hour, plumbers, pipefitters and steamfitters (SOC 47-2152)
    conf: high
    source: "BLS OEWS May 2025 (API): 'OEUM420000400000047215203 2025 A01 Annual 29.51'; Johnstown 30.10, Pittsburgh 36.26; Davis-Bacon PA20260055 mod 6 plumber base 40.02 + fringe 26.55"
  sprinkler_usd_h:
    value: 29.51
    low: 29.51
    high: 49.75
    unit: USD an hour, sprinkler fitters (in SOC 47-2152 with plumbers and pipefitters)
    conf: medium
    source: "BLS OEWS May 2025 (as plumber_usd_h, SOC 47-2152 includes sprinkler fitters); Davis-Bacon PA20260055 mod 6 sprinkler fitter base 49.75 + fringe 30.26"
  electrician_usd_h:
    value: 34.41
    low: 30.93
    high: 49.11
    unit: USD an hour, electricians (SOC 47-2111)
    conf: high
    source: "BLS OEWS May 2025 (API), SW PA nonmetro 34.41; Johnstown 30.93, Pittsburgh 36.22; Davis-Bacon PA20260055 mod 6 electrician base 49.11 + fringe 36.79"
  hvac_usd_h:
    value: 28.08
    low: 26.34
    high: 48.15
    unit: USD an hour, HVAC mechanics and installers (SOC 49-9021)
    conf: high
    source: "BLS OEWS May 2025 (API), SW PA nonmetro 28.08; Johnstown 26.34, Pittsburgh 31.07; Davis-Bacon PA20260055 mod 6 HVAC pipefitter base 48.15 + fringe 29.17"
  sheetmetal_usd_h:
    value: 25.41
    low: 25.41
    high: 46.75
    unit: USD an hour, sheet metal workers (SOC 47-2211)
    conf: high
    source: "BLS OEWS May 2025 (API), SW PA nonmetro 25.41 (Johnstown not published), Pittsburgh 30.27; Davis-Bacon PA20260055 mod 6 sheet metal base 46.75 + fringe 35.93"
  insulator_usd_h:
    value: 33.15
    low: 30.60
    high: 36.70
    unit: USD an hour, mechanical insulation workers (SOC 47-2132)
    conf: medium
    source: "BLS OEWS May 2025, not published for SW PA nonmetro or Johnstown; Pittsburgh MSA 33.15, Pennsylvania 36.70; Davis-Bacon PA20260055 mod 6 non-industrial mechanical insulator (survey) base 30.60 + 17.16"
  laborer_usd_h:
    value: 23.69
    low: 23.58
    high: 26.82
    unit: USD an hour, construction laborers (SOC 47-2061)
    conf: high
    source: "BLS OEWS May 2025 (API), SW PA nonmetro 23.69; Johnstown 23.58, Pittsburgh 26.09; Davis-Bacon PA20260055 mod 6 laborer base 26.82 + fringe 19.39"
  tab_usd_h:
    value: 28.08
    low: 26.34
    high: 48.15
    unit: USD an hour, the people who test, balance and commission (taken at the HVAC mechanics' wage)
    conf: low
    source: "as hvac_usd_h; no local wage for testing, adjusting and balancing technicians was found"
  tab_billing_usd_h:
    value: 101.44
    low: 45.6
    high: 163.59
    unit: USD an hour, a testing, adjusting and balancing firm's billed rate
    conf: low
    source: 'GSA MAS price lists: General & Mechanical Services 47QSHA22D0002; ENVIROS GS-21F-0102Y; Penn Air Control GS-21F-0191W: ''Testing & Balancing Technician | Customer_Facility | HR | 101.44 [GMS];
      Balance Technician - Normal Hours 7am to 3:30pm | Customer_Facility | HR | 104.8362 [GMS]; TAB Technician I | Customer_Facility | HR | 163.59 [ENVIROS]; TAB Technician '' (https://catalog-library-prod.s3-fips.us-east-1.amazonaws.com/pricelist/GS-21F-0102Y/pricelist_GS-21F-0102Y.xlsx,
      read 2026-11-23); Fully burdened federal ceiling rates (wage, fringe, overhead, G&A, profit, plus the 0.75% GSA fee); maximums, not local market rates; travel billed separately. Cells from each spreadsheet''s
      Price List sheet joined with '' | ''. Rate years: GMS from 10/8/2026, EN; GSA ceiling rates (maxima); low the HVAC mechanic''s wage x burden x the trade''s markup, 28.08 x 1.341 x 1.21'
  burden:
    value: 1.341
    low: 1.341
    high: 1.442
    unit: employer cost over the hourly wage, construction (OEWS's wage includes paid leave, which ECEC counts as a benefit)
    conf: high
    source: "BLS ECEC June 2026 (released 2026-09-09) Table 4, construction: 'Total compensation 51.96; Wages and salaries 36.13; Paid leave 2.63', so 51.96 / (36.13 + 2.63) = 1.341 on OEWS's wages; 51.96 / 36.13 = 1.438 (1.436-1.442 over Q1 2025 to Q2 2026) toward the high"

# Markups: the trade's on its own material and labour, then the builder's on the whole (PHFA's).
markup:
  trade_op:
    value: 0.21
    low: 0.1025
    high: 0.30
    unit: the trade subcontractor's overhead and profit, a share of its own material and labour
    conf: low
    source: "VAAR 48 CFR 852.243-70 (construction contract changes): 10% overhead and 10% profit, compounding to 21% on the first $20,000 and 10.25% over $50,000; PennDOT Publication 408/2026 110.03(d)7: 30% on direct labour (a highway rule). Change-order rules, not bid markups: no free source of the latter was found"
  book_to_net:
    value: 0.75
    low: 0.55
    high: 1.0
    unit: what a contractor pays for an item priced at a distributor's book or a maker's list, a share of that price
    conf: placeholder
    source: "judgement: no free source of trade discounts found; the agents' own pairs ran from about half (an electric tank $1,806 book, a near model $991 online; a 4 in. DCVA $7,985 book, $4,095 online) to near par"
  general_requirements:
    value: 0.06
    unit: the builder's general requirements, a share of the hard cost
    conf: high
    source: "PHFA 2025 Underwriting Application, Tab 07 Development Cost Limits (rev. 1-17-25): general requirements 6%"
  overhead:
    value: 0.02
    unit: the builder's overhead, a share of the hard cost
    conf: high
    source: "PHFA Tab 07 (as above): builder's overhead 2%"
  profit:
    value: 0.06
    unit: the builder's profit, a share of the hard cost
    conf: high
    source: "PHFA Tab 07 (as above): builder's profit 6%; general requirements, overhead and profit together 14% of the hard cost"
  contingency:
    value: 0.05
    low: 0.05
    high: 0.10
    unit: construction contingency, a share of the improvement cost
    conf: high
    source: "PHFA Tab 07 (as above): 5% for new construction (10% for rehabilitation, the high)"

