    source: "Holt (EC&M, 2009): '3VA per sq ft for general lighting and general-use receptacles [Table 220.12]'"
  small_appliance_va:
    value: 3000
    unit: VA, two small-appliance circuits at 1,500 VA
    conf: high
    source: "Holt (EC&M, 2009): '1,500VA for each small-appliance circuit (minimum of 2 circuits) [220.52(A)]'"
  laundry_va:
