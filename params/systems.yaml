# Addendum 4 (pass 3g step 3c, D28): the glass, decided by Jon 2026-11-21: its solar heat gain ("we
# can go with your recommendations"), and ENERGY STAR v7's Northern zone ("Want it? - yes").
addendum_4:
  window_u_max:
    value: 0.22
    unit: Btu/h ft2 F, the most whole-unit U-factor of the windows and patio doors (NFRC 100)
    conf: high
    source: "ENERGY STAR's criteria table, v7 (October 2023, https://www.energystar.gov/sites/default/files/asset/document/ES_Windows_Table_Oct2023.pdf), as a research agent read it (2026-11-21): Northern zone, prescriptive, 'U-Factor <= 0.22', 'SHGC >= 0.17'; every Pennsylvania ZIP code starting 15 or 16 is Northern (ENERGY STAR's 'V7 ES Zones by Zip Code'). The code asks 0.30 (PA 2021 IECC zone 5). Sold, NFRC-certified: Pella 250 Series vinyl casement, SunDefense+ Low-E, argon, foam-insulated frame, PEL-A-287-00292-00001, U 0.22, SHGC 0.18; its fixed unit PEL-A-289-00258-00001, U 0.22, SHGC 0.22 (Pella 2026 Architectural Design Manual); its Standard sliding patio door, 1 in. triple-pane SunDefense Low-E, 4/4/4 mm, argon, WDI-A-33-02762-00001, U 0.19, SHGC 0.23 (Pella 2025 ADM, 250-SPD, read by me)"
  shgc_min:
    value: 0.17
    unit: the least SHGC of the windows and patio doors (NFRC 200), ENERGY STAR's Northern floor
    conf: high
    source: "ENERGY STAR's criteria table, v7 (October 2023, https://www.energystar.gov/sites/default/files/asset/document/ES_Windows_Table_Oct2023.pdf), as a research agent read it (2026-11-21): Northern zone, prescriptive, 'SHGC >= 0.17'"
  air_leakage_cfm_ft2:
    value: 0.3
    unit: cfm per ft2, the most air leakage of the windows and patio doors (ENERGY STAR, all zones)
    conf: high
    source: "ENERGY STAR's criteria table, v7 (October 2023, https://www.energystar.gov/sites/default/files/asset/document/ES_Windows_Table_Oct2023.pdf), as a research agent read it (2026-11-21): 'Air Leakage <= 0.3 cfm/ft2', all zones"
  shgc_max:
    value: 0.25
    unit: the most solar heat gain coefficient of the windows and patio doors (NFRC 200, the whole unit)
    conf: high
    source: "the design (pass 3g step 3c): at the placeholder 0.35 no 1-ton unit covers a flat's cooling (Fujitsu's 12k gives 2.77 kW sensible on the ground floor's line set against 3.37 kW); at 0.25 the worst flat needs 2.62 kW and the 12k serves. The winter sun it gives up is heat the data center supplies. Such units are sold, NFRC-certified (makers' tables, a research agent's reading and mine, 2026-11-21): Pella 250 Series vinyl casement, 3/4 in. SunDefense Low-E, argon, PEL-A-287-00157-00001, U 0.26, SHGC 0.18; its fixed unit PEL-A-289-00122-00001, U 0.26, SHGC 0.22 (Pella 2026 Architectural Design Manual); its Standard sliding patio door, 3/4 in. SunDefense Low-E, 5 mm glass, argon, WDI-A-33-02494-00001, U 0.27, SHGC 0.21 (Pella 2025 ADM, 250-SPD); Pella Impervia fiberglass casement PEL-N-277-00243-00001, U 0.28, SHGC 0.20. Not ENERGY STAR v7 in its Northern zone (all of western Pennsylvania), which asks U at most 0.22 with SHGC at least 0.17"

