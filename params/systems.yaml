    unit: VA, the building heating loop's pump (Grundfos ALPHA2 15-55F), its most current at 115 V
    conf: high
    source: "Grundfos ALPHA2 15-55F submittal, product 99163906 (60 Hz): 'P1 max: 5 .. 45 W; Rated voltage: 115 V'; 'Maximum current consumption: 0.1 .. 0.65 A'; 0.65 x 115 = 75 VA. Its CP2 curve holds about 8.9 ft at step 3's 6.0 gpm against the 8.1 ft the loop needs (read off the curve by a research agent)"
