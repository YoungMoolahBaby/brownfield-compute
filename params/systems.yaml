# Each flat's ERV, basis of design: Broan EDGE BLP120E80NS-HW (HVI 2005431), from the HVI Certified
# Products Directory, Section III, its energy-ratings and air-flow spreadsheets (generated 2026-11-18:
# https://www.hvi.org/HVIORG/includes/themes/MuraBootstrap3/remote/cpd_reports/section_3_energyRatings.xlsx,
# .../section_3_airFlow.xlsx), which Broan's spec sheet (rev 1118775D) matches, as a research agent
# read them (2026-11-21). 120 V; four 4 in. ports; defrost: 'Automatically activated; maintain
# exhaust fan operation and shut off supply fan'.
erv:
  sre_32f:
    value: 0.80
    unit: sensible recovery efficiency at 32 F outdoors, 49 cfm net supply
    conf: high
    source: "HVI 2005431 energy ratings: 32 F, 49 cfm, 28 W, SRE 80%, ASRE 83%, NMT 0.77"
  sre_m13f:
    value: 0.55
    unit: sensible recovery efficiency at -13 F outdoors, 49 cfm, over its defrost cycles
    conf: high
    source: "HVI 2005431 energy ratings: -13 F, 49 cfm, 30 W, SRE 55%, ASRE 56%, NMT 0.51; low-temperature airflow drop 26.9% supply, 0.0% exhaust; imbalance 69.2%"
  nmt_95f:
    value: 0.74
    unit: net moisture transfer at 95 F outdoors (cooling), 49 cfm, as a fraction
    conf: high
    source: "HVI 2005431 energy ratings: 95 F, 49 cfm, 28 W, TRE 71%, ATRE 74%, NMT 0.74"
  watts_49cfm:
    value: 28
    unit: W at 49 cfm, 32 F
    conf: high
    source: "HVI 2005431 energy ratings (above)"
  esp_inwc:
    value: 0.4
    unit: in. w.c. it holds for its ducts across its airflow range
    conf: high
    source: "Broan spec sheet BLP120E80NS-HW (rev 1118775D): '30 to 125 CFM @ 0.2 in. w.g. / 30 to 112 CFM @ 0.4 in. w.g.', set in 1 cfm steps"
  cfm_min:
    value: 30
    unit: cfm, the least it can be set to
    conf: high
    source: "Broan spec sheet (above)"
  cfm_max:
    value: 112
    unit: cfm, the most it holds at esp_inwc
    conf: high
    source: "Broan spec sheet (above)"
  preheat_min_c:
    value: 0
    unit: C, the least the outdoor air is warmed to ahead of the ERV, so that it never defrosts
    conf: high
    source: "Broan EDGE user and installer manual 1115155WEB-A, 2.9.2 In-line Duct Heater (a research agent's reading, 2026-11-21): 'To prevent the unit from operating in defrost mode and allow continuous operation in cold conditions, the minimum heating temperature is 0 C (32 F)'; the heater 'shall have an integrated airflow sensor and an over temperature sensor', at least 12 in. from the unit's collar. Broan names an electric heater only. Without it the unit defrosts by stopping its supply fan (CSI spec 1119216B; HVI's -13 F test: 69.2% imbalance)"
  supply_min_c:
    value: 16.5
    unit: C, the least the ERV's supply reaches the rooms at
    conf: high
    source: "the Passive House Institute's comfort criterion, held here at the design temperature (stricter than PHI's -10 C): PHI Testing Procedures for Large Ventilation Units (11-2018, provisional, https://database.passivehouse.com/Media/certified_components_v2/component/model/icons/PHI_Testing_Procedures_for_Large_Ventilation_Units.pdf): 'a minimum supply air temperature of 16.5 C up to -10 C outdoor air temperature' (a search summary); Zehnder's PHI certificate 0325vs03 for its ComfoAir 160 ERV: a heater is required where the supply falls below it"

