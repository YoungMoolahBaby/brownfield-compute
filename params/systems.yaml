  # Steel plates where a pipe or cable passes a bored or notched wood member near its edge.
  nec_bore_edge_in:
    value: 1.25
    unit: in., the least from a bored hole's edge to the wood member's nearest edge for a cable or raceway; nearer, a 1/16 in. steel plate (NEC 300.4(A)(1))
    conf: medium
    source: "a paraphrase, the code's own text not opened: Vince LaPorta, 'NEC 300.4: protection against physical damage', IAEI Magazine Winter 2026 (the 2023 NEC, the rule in the code 'since 1990'): the hole's edge 'must be at least 1-1/4 inches from the nearest edge of the wood'; otherwise the wiring 'must be protected by a steel plate or bushing at least 1/16 inch thick'. Whether rigid PVC conduit is exempt (an exception) isn't confirmed, so the feeders' conduit is plated too"
  ipc_shield_edge_in:
    value: 1.25
    unit: in., the least from the nearest edge of a stud, joist or rafter to a plumbing pipe (not cast iron or galvanized steel) through it; nearer, a 16 ga steel shield plate (IPC 305.6)
    conf: high
    source: "IPC 2021 305.6 (Pennsylvania's, UpCodes, saved 2026-11-22 as data/raw/pass3g/step7/ipc3/ipc3_pa.html): 'In concealed locations where piping, other than cast iron or galvanized steel, is installed through holes or notches in studs, joists, rafters or similar members less than 1 1/4 inches (32 mm) from the nearest edge of the member, the pipe shall be protected by steel shield plates. Such shield plates shall have a thickness of not less than 0.0575 inch (1.463 mm) (No. 16 gage).'"
  imc_shield_edge_in:
    value: 1.5
    unit: "in., the same for mechanical piping (not cast iron or steel): the line sets, the loop's tails, the condensate (IMC 305.5)"
    conf: high
    source: "IMC 2021 305.5 (Pennsylvania's, UpCodes, data/raw/pass3g/step7/imc/imc3_pa.html): 'In concealed locations where piping, other than cast-iron or steel, is installed through holes or notches in studs, joists, rafters or similar members less than 1 1/2 inches (38 mm) from the nearest edge of the member, the pipe shall be protected by shield plates. Protective steel shield plates having a minimum thickness of 0.0575 inch (1.463 mm) (No. 16 gage)'"
  nfpa13r_shield_edge_in:
    value: 1.25
    unit: in., the same for sprinkler pipe through studs (NFPA 13R 5.2.3.7)
    conf: medium
    source: "NFPA 13R 5.2.3.7, the 2019 wording as the 2022 cycle's Second Revision No. 2 prints it (data/raw/pass3g/raw/sprinkler/13R_A2021_SDR.txt, a committee draft): 'Pipe or tube through holes or notches in wood and metal stud walls within 1 1/4 in. (32 mm) of the inside face of the stud shall be protected from mechanical damage'; A.5.2.3.7: 'An example of mechanical protection might consist of nail plates'"
