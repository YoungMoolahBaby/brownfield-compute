# Pass 3g (D28): the walk-up's systems, designed before anyone bids. The numbers its checks use.
#
# IBC 2021 is the edition Pennsylvania's UCC adopts from 2026-01-01 (55 Pa.B. 7701, Doc. No.
# 25-1513, 34 Pa. Code 403.21(a); appendices not adopted, 403.21(c)). Chapters 10 and 12 were read
# from UpCodes' "Pennsylvania Building Code 2021" pages as Jon saved them (2026-11-21,
# data/raw/upcodes/, gitignored). No Pennsylvania amendment note shows under 1020, 1031 or 1208.

code:
  room:
    min_dimension_ft:
      value: 7
      unit: ft, the least plan dimension of a habitable space other than a kitchen
      conf: high
      source: "IBC 2021 1208.1 Minimum room widths: 'Habitable spaces, other than a kitchen, shall be not less than 7 feet (2134 mm) in any plan dimension.'"
    kitchen_passage_in:
      value: 36
      unit: in, the least clear passage between counter fronts and appliances or walls in a kitchen
      conf: high
      source: "IBC 2021 1208.1: 'Kitchens shall have a clear passageway of not less than 3 feet (914 mm) between counter fronts and appliances or counter fronts and walls.'"
    min_ceiling_habitable_in:
      value: 90
      unit: in, the least ceiling height of habitable spaces and corridors (7 ft 6 in)
      conf: high
      source: "IBC 2021 1208.2 Minimum ceiling heights: 'Occupiable spaces, habitable spaces and corridors shall have a ceiling height of not less than 7 feet 6 inches (2286 mm) above the finished floor.'"
    min_ceiling_service_in:
      value: 84
      unit: in, the least ceiling height of bathrooms, kitchens, storage and laundry rooms, and of corridors within a dwelling unit (7 ft)
      conf: high
      source: "IBC 2021 1208.2: 'Bathrooms, toilet rooms, kitchens, storage rooms and laundry rooms shall have a ceiling height of not less than 7 feet (2134 mm)'; exception 4: 'Corridors contained within a dwelling unit or sleeping unit in a Group R occupancy shall have a ceiling height of not less than 7 feet (2134 mm)'"
    one_room_min_ft2:
      value: 120
      unit: ft2 of net floor area, the least a dwelling unit's largest room may have
      conf: high
      source: "IBC 2021 1208.3 Room area: 'Every dwelling unit shall have not less than one room that shall have not less than 120 square feet (11.2 m2) of net floor area.'"
    habitable_min_ft2:
      value: 70
      unit: ft2 of net floor area, the least for any other habitable room (kitchens exempt)
      conf: high
      source: "IBC 2021 1208.3: 'Other habitable rooms shall have a net floor area of not less than 70 square feet (6.5 m2).' Exception: 'Kitchens are not required to be of a minimum floor area.'"
  corridor:
    within_unit_min_in:
      value: 36
      unit: in, the least clear width of a corridor within a dwelling unit
      conf: high
      source: "IBC 2021 Table 1020.3 Minimum corridor width: 'Within a dwelling unit' 36 inches. (In 2018 this was Table 1020.2; 2021's Table 1020.2 is corridor fire-resistance rating.)"
    equipment_access_min_in:
      value: 24
      unit: in, the least clear width of a corridor for access to and use of mechanical, plumbing or electrical systems or equipment
      conf: high
      source: "IBC 2021 Table 1020.3: 'Access to and utilization of mechanical, plumbing or electrical systems or equipment' 24 inches"
  escape:
    # Same values as IBC 2018 1030 (params/bidset.yaml code.escape); the section is 1031 in 2021.
    net_clear_ft2:
      value: 5.7
      unit: ft2, the least net clear opening of an emergency escape and rescue opening
      conf: high
      source: "IBC 2021 1031.3.1 Minimum size: 'a minimum net clear opening of 5.7 square feet (0.53 m2)'. The 5 ft2 grade-floor exception isn't used: 5.7 everywhere is the safe side"
    min_height_in:
      value: 24
      unit: in, the least net clear opening height of an escape opening
      conf: high
      source: "IBC 2021 1031.3.2 Minimum dimensions: 'The minimum net clear opening height dimension shall be 24 inches (610 mm).' The dimensions 'shall be the result of normal operation of the opening.'"
    min_width_in:
      value: 20
      unit: in, the least net clear opening width of an escape opening
      conf: high
      source: "IBC 2021 1031.3.2: 'The minimum net clear opening width dimension shall be 20 inches (508 mm).'"
    max_sill_in:
      value: 44
      unit: in above the floor, the highest the bottom of an escape opening's clear opening may be
      conf: high
      source: "IBC 2021 1031.3.3 Maximum height from floor: 'not greater than 44 inches (1118 mm) measured from the floor.' 1031.2: R-2 in stories with one exit, and 'sleeping rooms below the fourth story above grade plane shall have not fewer than one emergency escape and rescue opening'"
  # IMC 2021 chapter 4 (Pennsylvania adopts it without amendment), read from UpCodes' page as a
  # research agent saved it (2026-11-21); Equation 4-9 is an image on that page, read by eye.
  vent:
    area_cfm_per_ft2:
      value: 0.01
      unit: cfm of outdoor air per ft2 of dwelling unit floor, Equation 4-9's first term
      conf: high
      source: "IMC 2021 403.3.2.1, Equation 4-9: 'Q_OA = 0.01 A_floor + 7.5(N_br + 1)', Q_OA in cfm, A_floor floor area in ft2, N_br 'number of bedrooms; not to be less than one'. (Pass 3b used ASHRAE 62.2-2016's 0.03 per ft2.)"
    per_occupant_cfm:
      value: 7.5
      unit: cfm per (bedrooms + 1), Equation 4-9's second term
      conf: high
      source: "IMC 2021 403.3.2.1, Equation 4-9 (above)"
    kitchen_cfm:
      value: 25
      unit: cfm continuous kitchen exhaust (100 intermittent)
      conf: high
      source: "IMC 2021 Table 403.3.2.3 Minimum required local exhaust rates for one- and two-family dwellings: 'Kitchens | 100 cfm intermittent or 25 cfm continuous'"
    bath_cfm:
      value: 20
      unit: cfm continuous bathroom exhaust (50 intermittent)
      conf: high
      source: "IMC 2021 Table 403.3.2.3: 'Bathrooms and toilet rooms | 50 cfm intermittent or 20 cfm continuous'"
  # Pennsylvania's 2021 IECC, residential, climate zone 5 (UpCodes' page as a research agent saved
  # it, 2026-11-21; UpCodes marks the zone 5 wall and ceiling cells as Pennsylvania's).
  envelope:
    wall_u_max:
      value: 0.051
      unit: Btu/h ft2 F, the highest U-factor a wood frame wall may have (zone 5)
      conf: high
      source: "PA 2021 IECC Table R402.1.2, row '5 and Marine 4': frame wall U 0.051; Table R402.1.3: R-23, or 13 + 7.5 (cavity + continuous), or 20 + 3.8. Pass 3 carries 2018's U-0.060 (pass3.envelope.wall_u)"
    ceiling_u_max:
      value: 0.026
      unit: Btu/h ft2 F, the highest U-factor of a ceiling (zone 5)
      conf: high
      source: "PA 2021 IECC Table R402.1.2, zone 5: ceiling U 0.026 (R-49, Table R402.1.3); the same as 2018's"
    fenestration_u_max:
      value: 0.30
      unit: Btu/h ft2 F, the highest U-factor of a window or glazed door (zone 5)
      conf: high
      source: "PA 2021 IECC Table R402.1.2, zone 5: fenestration U 0.30, SHGC NR (no requirement)"
    heated_slab_under_r:
      value: 5
      unit: h ft2 F/Btu under the full area of a heated slab, besides its edge insulation (R-10 to 4 ft or R-15 to 3 ft)
      conf: high
      source: "PA 2021 IECC Table R402.1.3 footnote d: 'R-5 insulation shall be provided under the full slab area of a heated slab in addition to the required slab edge insulation R-value'; zone 5 slab '10, 4 ft or 15, 3ft'"

# Phius 2024 Certification Guidebook v26.1.2 (Oct 2026), free from phius.org, as a research agent
# saved it (2026-11-21).
phius:
  supply_cfm_per_person:
    value: 15
    low: 15
    high: 18
    unit: cfm of outdoor air per occupant, supplied
    conf: high
    source: "Phius 2024 Guidebook 1.3.4.2 (p. 40): 'A minimum of 15 cfm per person must be provided and dedicated outdoor air supply to all bedrooms is required'; footnote 6: '18 cfm per occupant is recommended' (the high end)"
  extra_occupants:
    value: 1
    unit: occupants a dwelling has beyond its bedrooms
    conf: high
    source: "Phius 2024 Guidebook 1.4.4.8 (p. 97): 'Multifamily (including duplexes and townhouses): Calculate the occupant quantity as the number of bedrooms + 1 per dwelling unit.' Rates are 'the larger of either the supply air or exhaust air requirements' (p. 40)"
  balance:
    value: 0.10
    unit: the largest difference allowed between measured supply and exhaust, as a fraction
    conf: high
    source: "Phius 2024 Guidebook 1.3.4.2 (p. 39): 'Option 1: Total measured supply and exhaust airflows are within 10% of each other.'"
  airtight_cfm50_ft2:
    value: 0.06
    unit: cfm at 50 Pa per ft2 of gross enclosure, whole building
    conf: high
    source: "Phius 2024 Guidebook Table 1.3.3.2.0 Performance Path Airtightness Limits: 'All other buildings 0.06 CFM50/ft2'; gross enclosure 'measured at the exterior of the thermal boundary and includes surfaces in contact with the ground'"

design:
  heating_c:
    value: -16.3
    unit: C, the heating design dry bulb (99.6%)
    conf: high
    source: "2025 ASHRAE Handbook - Fundamentals ch. 14, Indiana County Airport - Stewart Field (WMO 725175), period 2005-23, as printed in climate.onebuilding.org's TMYx .stat file: 'Heating 1 -16.3 -13.4'. Pass 3 used Pittsburgh's -16.8 (pass3.loads.design_c)"
  cooling_db_c:
    value: 30.9
    unit: C, the cooling design dry bulb (0.4%)
    conf: high
    source: "2025 ASHRAE Handbook, Indiana County Airport (as above): 'Cooling 7 10.5 30.9 22.6 29.5 22.0': 0.4% dry bulb 30.9 C, mean coincident wet bulb 22.6 C; 1% 29.5 / 22.0. ERA5 at the site, 2005-2023 (PVGIS): 0.4% hour 30.1 C"
  cooling_wb_c:
    value: 22.6
    unit: C, the mean coincident wet bulb at the 0.4% cooling dry bulb
    conf: high
    source: "2025 ASHRAE Handbook, Indiana County Airport (as above)"
  cooling_indoor_f:
    value: 75
    unit: F, the indoor temperature cooling is designed to
    conf: high
    source: "PA 2021 IECC Table R405.4.2(1), the standard reference design's thermostat: 'cooling temperature setpoint = 75 F' (UpCodes' page as a research agent saved it, 2026-11-21)"
  cooling_indoor_rh:
    value: 0.50
    unit: relative humidity held indoors in cooling, as a fraction
    conf: low
    source: "judgement: 50% at 75 F, the usual comfort design point; no free primary source fetched"
  station_pressure_pa:
    value: 96288
    unit: Pa, standard air pressure at Indiana County Airport's 428 m
    conf: high
    source: "climate.onebuilding.org's TMYx .stat for Indiana County Airport - Stewart Field (WMO 725175): 'Elevation -- 428 m above sea level', 'Standard Pressure at Elevation -- 96288 Pa'"
  igain_btu_day:
    value: 17900
    unit: Btu/day per dwelling unit, the constant in the IECC reference design's internal gains
    conf: high
    source: "PA 2021 IECC Table R405.4.2(1): 'IGain, in units of Btu/day per dwelling unit, shall equal 17,900 + 23.8 x CFA + 4,104 x Nbr' (CFA conditioned floor area ft2, Nbr bedrooms)"
  igain_btu_day_per_ft2:
    value: 23.8
    unit: Btu/day per ft2 of conditioned floor area
    conf: high
    source: "PA 2021 IECC Table R405.4.2(1) (above)"
  igain_btu_day_per_bedroom:
    value: 4104
    unit: Btu/day per bedroom
    conf: high
    source: "PA 2021 IECC Table R405.4.2(1) (above)"
  shgc:
    value: 0.35
    low: 0.25
    high: 0.45
    unit: the windows' and patio doors' solar heat gain coefficient
    conf: placeholder
    source: "placeholder until the window is chosen (the schedule carries none: the IDS field is empty); PA 2021 IECC sets none in zone 5 (Table R402.1.2, 'NR')"
  bed_1_occupants:
    value: 2
    unit: occupants of the larger bedroom; the other bedroom has 1, so a flat has bedrooms + 1 (Phius)
    conf: medium
    source: "judgement on Phius's count (bedrooms + 1): two in the primary bedroom, one in the second"

  counter_depth_in:
    value: 25
    low: 24
    high: 26
    unit: in, a kitchen counter's depth with its overhang, along the plumbing wall
    conf: low
    source: "judgement: the usual US base cabinet (24 in) with a countertop overhang; no source fetched yet"
  tub_length_in:
    value: 60
    unit: in, a bathtub's length across the bath, the floor it covers taking no tubing
    conf: low
    source: "judgement: the usual US alcove tub (60 x 30 in); the bath's 5.35 ft clear width fits it (pass 3g step 1)"
  tub_width_in:
    value: 30
    unit: in, a bathtub's depth from the wall
    conf: low
    source: "judgement: the usual US alcove tub (60 x 30 in)"
  finished_floor_upper_in:
    value: 1.5
    unit: in, the radiant floor's gypsum topping on the upper floors, which comes off the ceiling height below it
    conf: medium
    source: "pass 3b's radiant topping (docs/pass3/README.md, 1.5 in. at 115 lb/ft3); the ground floor's tubing is in the slab"

# Addendum 3 (pass 3g, D28; Jon: "yes addendum 3 - and it should bring the envelope to code"): the
# walk-up's envelope to Pennsylvania's 2021 IECC, zone 5 (code.envelope above).
addendum_3:
  ci_in:
    value: 1.0
    unit: in of continuous insulation board outboard of the wall sheathing (forge `apartment-json addendum-3 60 <ci_in>`)
    conf: medium
    source: "judgement: 1 in of any common board (XPS about R-5, polyiso about R-6, mineral wool about R-4.2 an inch, makers' figures not fetched) gives the R-3.8 the code asks; the product is the bidder's"
  ci_r:
    value: 3.8
    unit: h ft2 F/Btu, the least continuous insulation the walls take
    conf: high
    source: "PA 2021 IECC Table R402.1.3, zone 5 wood frame wall: '20 + 3.8' (cavity + continuous; footnote h: 'The first value is cavity insulation, the second value is continuous insulation')"
  cavity_r:
    value: 20
    unit: h ft2 F/Btu, the 2x6 stud cavities' insulation (as pass 3 had it)
    conf: high
    source: "PA 2021 IECC Table R402.1.3, zone 5: '20 + 3.8'; pass 3's R-20 cavity (pass3.envelope.wall_u)"
  wall_u:
    value: 0.051
    unit: Btu/h ft2 F, the walls' U-factor with the continuous insulation
    conf: high
    source: "PA 2021 IECC: Table R402.1.3's 20 + 3.8 is the prescriptive equal of Table R402.1.2's frame wall U-0.051 (code.envelope.wall_u_max), the U the heat model uses"
  slab_under_r:
    value: 5
    unit: h ft2 F/Btu under the full area of the ground floor's heated (radiant) slab
    conf: high
    source: "PA 2021 IECC Table R402.1.3 footnote d (code.envelope.heated_slab_under_r)"
  slab_edge_r:
    value: 10
    unit: h ft2 F/Btu at the slab edge, to slab_edge_depth_ft
    conf: high
    source: "PA 2021 IECC Table R402.1.3, zone 5 slab: '10, 4 ft or 15, 3ft'"
  slab_edge_depth_ft:
    value: 4
    unit: ft, how far the slab-edge insulation reaches
    conf: high
    source: "PA 2021 IECC Table R402.1.3, zone 5 slab: '10, 4 ft'; footnote d: for heated slabs it 'shall not be required to extend below the slab'"

# Pass 3g step 2 (D28): water, drainage, hot water and electrical loads.
plumbing:
  # IPC 2021 Appendix E Table E103.3(2), private fixtures (via Michigan's 2021 IPC; see
  # data/ipc2021_hunter_flush_tank.csv for why). Water supply fixture units, total / cold / hot.
  wsfu_bath_group:
    value: 3.6
    unit: wsfu, a bathroom group with a flush tank (cold 2.7, hot 1.5)
    conf: high
    source: "IPC 2021 Table E103.3(2): 'Bathroom group | Private | Flush tank | 2.7 | 1.5 | 3.6'"
  wsfu_bath_group_cold:
    value: 2.7
    unit: wsfu, cold
    conf: high
    source: "IPC 2021 Table E103.3(2) (above)"
  wsfu_bath_group_hot:
    value: 1.5
    unit: wsfu, hot
    conf: high
    source: "IPC 2021 Table E103.3(2) (above)"
  wsfu_kitchen_sink:
    value: 1.4
    unit: wsfu (cold 1.0, hot 1.0)
    conf: high
    source: "IPC 2021 Table E103.3(2): 'Kitchen sink | Private | Faucet | 1.0 | 1.0 | 1.4'"
  wsfu_kitchen_sink_each:
    value: 1.0
    unit: wsfu, cold or hot
    conf: high
    source: "IPC 2021 Table E103.3(2) (above)"
  wsfu_dishwasher:
    value: 1.4
    unit: wsfu, hot only
    conf: high
    source: "IPC 2021 Table E103.3(2): 'Dishwashing machine | Private | Automatic | — | 1.4 | 1.4'"
  wsfu_washer:
    value: 1.4
    unit: wsfu (cold 1.0, hot 1.0)
    conf: high
    source: "IPC 2021 Table E103.3(2): 'Washing machine (8 lb) | Private | Automatic | 1.0 | 1.0 | 1.4'"
  wsfu_washer_each:
    value: 1.0
    unit: wsfu, cold or hot
    conf: high
    source: "IPC 2021 Table E103.3(2) (above)"
  # IPC 2021 Table 709.1, drainage fixture units (Pennsylvania, unamended).
  dfu_bath_group:
    value: 5
    unit: dfu, a bathroom group with a 1.6 gpf water closet
    conf: high
    source: "IPC 2021 Table 709.1: 'Bathroom group as defined in Section 202 (1.6 gpf water closet) | 5'"
  dfu_kitchen:
    value: 2
    unit: dfu, a kitchen sink with its dishwasher
    conf: high
    source: "IPC 2021 Table 709.1: 'Kitchen sink, domestic with food waste disposer, dishwasher or both | 2 | 1 1/2'"
  dfu_washer:
    value: 2
    unit: dfu, a clothes washer
    conf: high
    source: "IPC 2021 Table 709.1: 'Automatic clothes washers, residential | 2 | 2'"
  vent_above_roof_in:
    value: 12
    low: 6
    high: 24
    unit: in, the stack vents' extension above the roof
    conf: placeholder
    source: "IPC 2021 903.1.1: 'Open vent pipes that extend through a roof shall be terminated not less than [NUMBER] inches (mm) above the roof' - the adopting jurisdiction's number; Pennsylvania's not found (UpCodes' PA chapter 9 page leaves it blank)"
  max_static_psi:
    value: 60
    low: 50
    high: 80
    unit: psi, the most static pressure in the building's piping (a pressure-reducing valve where the street gives more)
    conf: medium
    source: "a design choice for quiet: IPC 2021 604.8 asks a reducing valve above 80 psi; Warnock and Morin (NRC, NRCC-35548, 1990): 'A-weighted noise levels were found to increase linearly with pressure by about 5 dB when supply pressure was increased from 40 to 100 psi ... a correction term (p - 70)/12 dB'"
  fixture_psi:
    value: 20
    unit: psi, the flow pressure the tub's and shower's balanced-pressure valves need, the building's highest
    conf: high
    source: "IPC 2021 Table 604.3: 'Shower, balanced-pressure, thermostatic or combination balanced-pressure/thermostatic mixing valve | 2.5 | 20'; the bathtub's the same 20 psi; the sinks 8"
  cold_fps:
    value: 8
    low: 8
    high: 10
    unit: ft/s, the most in cold-water pipe, for quiet
    conf: high
    source: "a design choice for quiet, though the pipe is PEX: CDA Copper Tube Handbook A4015-26/24 (2026) p. 15: 'To avoid excessive system noise and the possibility of erosion-corrosion, the designer should not exceed flow velocities of 8 feet per second for cold water and 5 feet per second in hot water up to approximately 140 F'. REHAU's limit for its PEX is 10 (855.739 Table 5.1: 'REHAU recommends a maximum design velocity of 10 ft/sec')"
  hot_fps:
    value: 5
    low: 5
    high: 8
    unit: ft/s, the most in hot-water pipe, for quiet
    conf: high
    source: "a design choice for quiet: CDA Copper Tube Handbook A4015-26/24 (2026) p. 15: 'To avoid excessive system noise and the possibility of erosion-corrosion, the designer should not exceed flow velocities of 8 feet per second for cold water and 5 feet per second in hot water up to approximately 140 F'. REHAU's limit for its PEX is 8 (855.739 Table 5.1)"
  return_fps:
    value: 2
    unit: ft/s, the most in the recirculating return
    conf: high
    source: "REHAU PEXa Plumbing Design and Installation Guide 855.739 (09.2023), 5.1.3 Table 5.1, p. 17 (a research agent's reading, 2026-11-21): 'Hot-Water Recirculation Return Piping - Maximum velocity of 2 ft/sec - Maximum operating temperature of 140 F'"
  pex_sweep_el_d:
    value: 17
    unit: pipe diameters of straight PEX, a 90 degree sweep at six diameters' radius (step 7c counts one at each routed bend)
    conf: medium
    source: "Crane TP-410M's resistance of 90 degree rounded bends, K / f_T against r / d, as python-fluids reproduces it (fittings.py, bend_rounded_Crane_ratios / _fds: r/d 6 -> 17; saved data/raw/pass3g/step7/pex/fluids_fittings.py): K = 17 f_T, so 17 diameters where f is near f_T. PPI's PEX design guide (3rd ed., Table 3.2) sets the free bending radius at six times the outside diameter, and (ch. 6) 'install directional fittings such as 90-degree elbows only when necessary, such as within tight cavities. The use of sweeps ... will typically reduce ... pressure drop'"
  fittings_factor:
    value: 1.5
    unit: the developed length's multiple for its fittings and valves
    conf: medium
    source: "IPC 2021 Appendix E, E103.3.1 (Michigan's copy): 'A general rule that has been used is to add 50 percent of the developed length to allow for fittings and valves'"
  valve_height_in:
    value: 48
    unit: in, the top floor's shower valve above its floor (the highest outlet needing 20 psi)
    conf: low
    source: "judgement: a usual shower valve rough-in"
  main_depth_ft:
    value: 5
    low: 4
    high: 6
    unit: ft, the street main below grade
    conf: placeholder
    source: "placeholder: below western Pennsylvania's frost line; the water authority's to give"
  street_psi:
    value: 55
    low: 40
    high: 80
    unit: psi, the least static pressure at the street main
    conf: placeholder
    source: "placeholder: the Central Indiana County Water Authority (PWSID PA5320040, EPA SDWIS) publishes no pressures or hydrant tests; the design states the least it needs, and a hydrant flow test (NFPA 291) is to request"
  tap_in:
    value: 2
    unit: in, the service's tap on the main
    conf: medium
    source: "a design choice matching the 2 in. service devices"
  meter_psi_40:
    value: 0.56
    unit: psi through the 2 in. main meter at 40 gpm
    conf: medium
    source: "Neptune MACH 10 Intermediate (2 in. x 17 in.) spec sheet 25-016218 PS MACH10 INTERMEDIATE 07.25 p. 2, read off its pressure-loss curve by a research agent (2026-11-21); normal range 1.5-160 gpm; the authority's meter, to confirm"
  dcva_psi_40:
    value: 5.5
    unit: psi through a 2 in. double check valve assembly at 40 gpm
    conf: medium
    source: "Watts spec sheet ES-LF007S 2623 (Watts LF007, 2 in.), p. 4, its flow curve read by a research agent; the authority decides between it and a reduced-pressure zone assembly (Watts LF009 2 in., 13.2 psi at 40 gpm, ES-LF009 2611 p. 5)"
  rpz_psi_40:
    value: 13.2
    unit: psi through a 2 in. reduced-pressure zone assembly at 40 gpm, if the authority asks one instead of the double check
    conf: medium
    source: "Watts spec sheet ES-LF009 2611 (Watts LF009, 2 in.), p. 5, as dcva_psi_40's source reads it: '13.2 psi at 40 gpm'"
  prv_falloff_psi_40:
    value: 9.7
    unit: psi, a 2 in. pressure-reducing valve's falloff at 40 gpm
    conf: medium
    source: "Watts spec sheet ES-LFN45B-L 2142 (Watts LFN45B, 2 in.), p. 2, its curve read by a research agent; adjustable 25-75 psi"
  submeter_psi_13:
    value: 2.2
    unit: psi through each flat's 3/4 in. water meter at 13 gpm
    conf: medium
    source: "Badger Meter E-Series Ultrasonic Plus 3/4 in., ESM-DS-02022-EN-08 (June 2025), its curve read by a research agent (1.2 psi at 10 gpm; the table: '2.8 psi at 15 gpm'); measured fluid 34-140 F, accuracy stated 45-122 F"
  submeter_psi_10:
    value: 1.2
    unit: psi through the same at 10 gpm
    conf: medium
    source: "Badger ESM-DS-02022-EN-08 (above)"
  tmv_psi_26:
    value: 5
    unit: psi through the master mixing valve at 26 gpm
    conf: high
    source: "Leonard TM-186-820B-LF (ASSE 1017) submittal S-1233F-LF (Aug 2018), its flow table: '26 gpm at 5 psi; 40 gpm at 10 psi'; 1.0 gpm least; 'will maintain temperature with 0.5GPM flow from the domestic hot water loop'"
  tmv_psi_40:
    value: 10
    unit: psi through the same at 40 gpm
    conf: high
    source: "Leonard S-1233F-LF (above)"
hot_water:
  gpd_per_person:
    value: 25
    low: 20
    high: 49
    unit: gallons of 120 F hot water per person on the design day
    conf: high
    source: "Ecotope, Ecosizer manual (May 2025) p. 6: field studies' '98th percentile of daily hot water demand ... evaluates to 25 gpdpp'; ASHRAE Low 20, Medium 49 (the range); EcosizerEngine's multi_family.json 'ecoMark': 25 (GitHub EcotopeResearch/EcosizerEngine, commit 7586430)"
  occupants_per_flat:
    value: 3
    low: 2.39
