# Pass 3g step 5 (D28): the basis-of-design equipment's electrical data, as a research agent read
# the makers' sheets (2026-11-21) and I checked the numbers against its saved text.
house:
  dhw_heat_pump_va:
    value: 4638
    unit: VA, the hot-water plant's water-to-water heat pump (ClimateMaster Tranquility SW036, no internal pumps), its minimum circuit ampacity at 208 V
    conf: high
    source: "ClimateMaster Tranquility SW catalogue RP3006 (revised 2026-09-23), electrical data: 'SW036 208/230-1-60 ... 14.6 [RLA] 76.0 [LRA] ... 18.6 [FLA] 22.3 [MCA] 35 [MOCP]'; 22.3 A x 208 V. Its part-load heating table, source 80 F at 6.5 gpm, load in 120 F at 3.3 gpm: '34,605 [Btuh] 2,313 [W] ... 141 [LWT F] 4.4 [COP]'. Its source is the data center's water after the preheat, at 80 F (hot_water.hp_source_f): no US water-to-water unit is rated on 122 F"
  largest_motor_extra:
    value: 0.25
    unit: of the largest motor's load, added for a feeder (125% of it in all)
    conf: medium
    source: "NEC 430.24 and 220.50 (a feeder carries 125% of its largest motor's current and the others at 100%), the rule as every load-calculation guide states it; its 2020 text not read here"
  continuous_factor:
    value: 1.25
    unit: times a continuous load (3 hours or more) for a feeder's conductors and breaker
    conf: medium
    source: "NEC 215.2(A)(1) and 215.3 (feeders: 125% of continuous loads), the rule as every load-calculation guide states it; its 2020 text not read here. 625.42 (quoted under ev) makes EV charging continuous"
  dhw_heat_pump_mocp_a:
    value: 35
    unit: A, its maximum overcurrent device
    conf: high
    source: "ClimateMaster RP3006 (above): 'MOCP 35'"
  loop_pump_va:
