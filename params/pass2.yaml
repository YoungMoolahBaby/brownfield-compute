# Pass 2: one 100 MW (IT) data center module at Homer City, two designs on the same weather and
# load. Conventional: water-cooled, heat to evaporative cooling towers. Good neighbour: direct
# liquid cooling on a warm-water loop, dry coolers, heat sold to a town network and greenhouses.

module:
  it_mw:
    value: 100
    unit: MW of IT load at full use, the repeatable unit (D4)
    conf: high
    source: "definition; a typical hyperscale building or phase is tens to ~100+ MW (AWS's Homer City filing gives no MW per building)"
  load_factor:
    value: 0.8
    low: 0.6
    high: 0.95
    unit: mean IT load over the year as a share of it_mw
    conf: placeholder
    source: "judgement: AI training runs near full load, cloud lower; to source (LBNL 2024 utilisation assumptions)"

conventional:
  chiller_cop:
    value: 6
    low: 4
    high: 8
    unit: chiller coefficient of performance; the towers reject IT heat x (1 + 1/COP)
    conf: placeholder
    source: "judgement: water-cooled centrifugal chillers at data center conditions; economiser hours (chiller off) ignored, so the towers' heat is slightly overstated"
  evap_fraction:
    value: 0.88
    low: 0.75
    high: 1.0
    unit: share of tower heat removed by evaporation (the rest sensible)
    conf: medium
    source: "the rule 'evaporation 0.85% of circulation per 10 F of range' (Mortensen, Univ. of Houston 2022 water forum, citing DOE/EPA) against the all-latent value c_p dT / h_fg = 0.96% per 10 F: 0.85/0.96 = 0.88; 1.0 = the '1% per 10 F' rule"
  cycles:
    value: 4
    low: 3
    high: 6
    unit: cycles of concentration; blowdown = evaporation / (cycles - 1)
    conf: medium
    source: "typical open recirculating towers run 3-6 cycles (Mortensen 2022; blowdown formula the standard one, same source)"

good_neighbour:
  liquid_fraction:
    value: 0.85
    low: 0.7
    high: 0.9
    unit: share of IT heat taken by direct-to-chip liquid cooling (the rest by air)
    conf: low
    source: "the OCP MGX rack spec reportedly sets 120 kW racks with an 85% liquid heat-capture requirement (secondary: vendor-neutral planning page cheatsheets.davidveksler.com/datacenter-cooling-thresholds.html; spec itself not read); low end for mixed cloud halls"
  liquid_supply_c:
    value: 40
    low: 32
    high: 45
    unit: C, facility water supply temperature to the liquid loop
    conf: medium
    source: "ASHRAE TC 9.9 Thermal Guidelines 5th ed. (2021) classes W32, W40 (new, 'several manufacturers ... around 40 C'), W45 (Upsite summary); W40 central"
  liquid_rise_k:
    value: 10
    low: 6
    high: 15
    unit: K, temperature rise of facility water through the IT (return = supply + rise)
    conf: placeholder
    source: "judgement, to source (cold plate flow design)"
  air_supply_c:
    value: 20
    low: 16
    high: 24
    unit: C, chilled water supply to the air-side coils
    conf: placeholder
    source: "judgement: air at ~25-27 C into the IT (ASHRAE recommended envelope up to 27 C) needs coil water a few K colder"
  approach_k:
    value: 7
    low: 5
    high: 10
    unit: K, dry cooler approach (coolant out minus outdoor air)
    conf: placeholder
    source: "judgement, to source (dry cooler selections)"
  trim_cop:
    value: 5
    low: 3.5
    high: 7
    unit: COP of the chillers that trim when dry coolers can't reach supply temperature (no water)
    conf: placeholder
    source: "judgement: air-cooled chillers at mild lift"
  hp_carnot_eff:
    value: 0.55
    low: 0.45
    high: 0.65
    unit: heat pump COP as a share of the Carnot COP between evaporating and condensing temperatures
    conf: medium
    source: "IEA HPT Annex 57 Danish case (Felding): a water/water unit measured COP 3.58 from -4.5 C source to a 30/55 C sink = 0.65 of Carnot without approaches (high end); Danish planning uses COP ~3.5 for large district heating heat pumps on cold sources; 0.55 central, below the measured unit"
  hp_approach_k:
    value: 5
    low: 3
    high: 8
    unit: K, heat exchanger approach on each side of the heat pump (evaporating below the source, condensing above the supply)
    conf: placeholder
    source: "judgement: typical plate heat exchanger approaches; left out in v1, which put COP at 7.0"
  dh_supply_c:
    value: 75
    low: 65
    high: 85
    unit: C, district heating supply temperature the heat pumps deliver
    conf: medium
    source: "Odense: heat pumps raise data center heat to 70-75 C 'suitable for the city's district heating network' (Ramboll project page)"

town:
  homes:
    value: 5000
    low: 2000
    high: 14000
    unit: homes on the district heating network
    conf: medium
    source: "Indiana borough has ~4,698 households (Census QuickFacts 2019-2023; 14,697 people July 2025), ~13 km from the plant. High end ~14,000: Indiana borough + White Twp (14,933) + Homer City borough (1,708) + Center Twp (4,330) + Black Lick Twp (1,105) at 2.36 persons per household (county, QuickFacts 2014-2018), Census sub-county estimates vintage 2025"
  heat_per_home_mwh:
    value: 15
    low: 12
    high: 18
    unit: MWh of heat a year delivered per home (space heat + hot water)
    conf: medium
    source: "EIA RECS 2020 Table CE5.4: 60.75 million Btu of natural gas a year for space heating per household in very cold and cold climates = 17.8 MWh of fuel; x ~0.85 furnace efficiency = 15.1 MWh of heat. Odense: 100,000 MWh for 6,900 homes = 14.5 (Meta 2018), 215,000 for 12,000 = 17.9 (Ramboll)"
  hot_water_share:
    value: 0.15
    low: 0.1
    high: 0.25
    unit: share of annual heat that is hot water (flat over the year)
    conf: placeholder
    source: "judgement, to source (RECS water heating vs space heating)"
  base_c:
    value: 15.5
    low: 13
    high: 18
    unit: C, outdoor temperature below which homes need space heat
    conf: medium
    source: "balance-point convention for heating degree days (15.5 C for well-insulated homes, 18 C traditional)"

greenhouse:
  hectares:
    value: 10
    low: 0
    high: 100
    unit: ha of greenhouse heated by the module
    conf: placeholder
    source: "a design choice to explore, not a fact"
  u_w_m2k:
    value: 4.3
    low: 4.0
    high: 4.5
    unit: W/m2K, double polyethylene cover
    conf: medium
    source: "double poly 0.7 Btu/h ft2 F (Univ. of Kentucky) to 0.8 (Univ. of Wisconsin): 4.0-4.5 W/m2K"
  cover_ratio:
    value: 1.3
    low: 1.2
    high: 1.5
    unit: m2 of cover per m2 of floor
    conf: placeholder
    source: "judgement: gutter-connected houses; walls and roof slopes"
  set_c:
    value: 18
    low: 15
    high: 21
    unit: C, inside temperature held
    conf: placeholder
    source: "judgement: vegetables and leafy greens"

fans:
  tower_kw_per_kw:
    value: 0.025
    low: 0.015
    high: 0.04
    unit: kW of tower fans + condenser pumps per kW of heat rejected (conventional)
    conf: placeholder
    source: "judgement, to source; towers move less air than dry coolers because evaporation carries most of the heat"
  dry_kw_per_kw:
    value: 0.035
    low: 0.02
    high: 0.05
    unit: kW of dry cooler fans + loop pumps per kW of heat rejected to air (good neighbour)
    conf: placeholder
    source: "judgement, to source; set above the towers' on purpose: a dry cooler rejects heat sensibly only and needs more air, so leaving this out would flatter the good-neighbour design"

noise:
  target_night_db:
    value: 40
    low: 35
    high: 45
    unit: dB(A), night level outside the nearest home
    conf: high
    source: "WHO Night Noise Guidelines for Europe (2009): Lnight,outside 40 dB as the guideline value (55 dB interim target). For comparison, Loudoun County, VA enforces a 55 dB average limit (county noise page) and Chandler, AZ (2023) caps data centers at their baseline study level"
  alpha_db_km:
    value: 1.9
    low: 1.0
    high: 3.7
    unit: dB/km, air absorption at 500 Hz
    conf: high
    source: "ISO 9613-2 Table 2 (10 C, 70% RH): 1.0 dB/km at 250 Hz, 1.9 at 500 Hz, 3.7 at 1 kHz; 500 Hz is the standard's band for its A-weighted method"
  h_m:
    value: 4
    low: 2
    high: 8
    unit: m, mean height of the sound path above ground (source on a roof or pad, ear at 4 m)
    conf: placeholder
    source: "judgement: rooftop or pad-mounted coolers; ISO 9613-2 eq. (10) uses it"
  barrier_db:
    value: 10
    low: 5
    high: 15
    unit: dB, a berm or wall between the coolers and the homes (good neighbour only)
    conf: placeholder
    source: "judgement: ISO 9613-2 caps single diffraction at 20 dB; 5-15 dB is what earth berms typically give; to size with the site's terrain"
  tower_fan_lw:
    value: 100
    low: 90
    high: 106
    unit: dB(A), sound power of one cooling tower fan cell at design speed
    conf: low
    source: "a cooling tower fan study lists per-fan sound power from ~79 to 106 dB(A) by fan type and operating point (BAC Sound Expert, via search; not read in full); 100 central for large induced-draft cells"
  tower_mw_per_fan:
    value: 5
    low: 3
    high: 8
    unit: MW of heat per tower fan cell
    conf: placeholder
    source: "judgement, to source (tower selections)"
  dry_fan_lw:
    value: 88
    low: 82
    high: 94
    unit: dB(A), sound power of one dry cooler fan (~1 m EC fan) at design speed
    conf: placeholder
    source: "judgement, to source (dry cooler data sheets)"
  dry_mw_per_fan:
    value: 0.12
    low: 0.08
    high: 0.2
    unit: MW of heat per dry cooler fan at design speed
    conf: placeholder
    source: "judgement: a large V-type dry cooler of ~10-12 fans rejects ~1-1.5 MW at design (to source)"
  dry_oversize:
    value: 2
    low: 1
    high: 3
    unit: dry cooler area over the minimum (k), so fans run at ~1/k speed at design
    conf: placeholder
    source: "a design choice: k times the fans at 1/k speed changes sound power by 50 lg(1/k) + 10 lg(k) = -40 lg(k) (fan law); vendor: EC fans at half airflow are 15 dB(A) quieter (Guntner GreenTech claim), matching 50 lg(0.5) = -15.05"

backup:
  installed_per_it_mw:
    value: 1.3
    low: 1.2
    high: 1.5
    unit: MW of backup generation per MW of IT (IT + cooling at peak, plus spare units)
    conf: placeholder
    source: "judgement: the facility's peak load with N+1 spares, to source"
  gen_mw:
    value: 3.0
    low: 2.0
    high: 3.5
    unit: MW per diesel generator set
    conf: placeholder
    source: "judgement: hyperscale sites use 2-3+ MW gensets, to source"
  test_hours:
    value: 24
    low: 12
    high: 100
    unit: hours a year each generator runs for maintenance and readiness tests
    conf: medium
    source: "legal cap: 100 hours a calendar year for maintenance checks and readiness testing of emergency engines (40 CFR 60.4211(f)); 12-24 = a monthly run plus an annual load bank (judgement)"
  test_load:
    value: 0.5
    low: 0.3
    high: 1.0
    unit: share of rating during tests
    conf: placeholder
    source: "judgement: monthly runs are light, load-bank tests full"
  nox_g_kwh:
    value: 6.4
    low: 0.67
    high: 6.4
    unit: g of NOx (+NMHC) per kWh generated
    conf: medium
    source: "EPA Tier 2 limit for engines over 560 kW, NMHC+NOx 6.4 g/kWh (40 CFR 89.112 Table 1, from memory, to confirm), which emergency engines may meet; Tier 4 final 0.67 g/kWh NOx (low end)"
  battery_minutes:
    value: 15
    low: 5
    high: 60
    unit: minutes of full facility load from batteries (good neighbour), bridging to the on-site gas plant and grid
    conf: placeholder
    source: "judgement: Homer City has a 4.5 GW gas plant on the same campus (AWS filing), so batteries only bridge the switch; whether operators accept that without diesel is the open question"

jobs:
  per_aws_building:
    value: 45
    low: 38
    high: 51
    unit: permanent jobs per AWS building (both designs)
    conf: high
    source: "AWS filing: 1,500-2,000 permanent staff for 39 buildings = 38-51 per building; 50 per building at the peak shift (parking)"
  greenhouse_per_ha:
    value: 7
    low: 2.5
    high: 15
    unit: jobs per hectare of vegetable greenhouse
    conf: medium
    source: "Urban Ag News: US greenhouse vegetables 'three to four employees per acre (six to eight employees per hectare)'; automated lettuce 1-2 per acre (low); an advocacy budget implies ~14 per ha (high)"
