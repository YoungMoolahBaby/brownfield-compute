# The walk-up's website (GitHub Pages): a plan room for its bid documents and the 3D viewer, built
# by tools/viewer/build_site.py from the published bid set (docs/pass3/bidset) and the two packages
# pinned in tools/viewer/package-lock.json. https://youngmoolahbaby.github.io/brownfield-compute/
#
# Actions are pinned to the commits of their releases (checked 2026-11-20), not to tags, which can
# move.
name: website

on:
  push:
    branches: [main]
    paths:
      - "tools/viewer/**"
      - "docs/pass3/bidset/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read  # the build job gets only this; deploy gets what Pages needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.19.0"  # the Node the project's `webifc` group pins (nodejs-wheel-binaries)
      - name: Install the viewer's pinned packages (no install scripts)
        working-directory: tools/viewer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the site
        run: python3 tools/viewer/build_site.py site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
